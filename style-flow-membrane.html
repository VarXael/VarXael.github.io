<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flOw Style · Membrane</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Work+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eaf6ff;--dim:rgba(234,246,255,.6);--cyan:#7fe3ff;--amber:#ffc478;--violet:#e096ff;--aqua:#78ffcd;
    --head:'Syncopate',sans-serif;--body:'Work Sans',sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;font-family:var(--body);color:var(--ink);background:radial-gradient(130% 90% at 50% -10%,#0c3a4f 0%,#072634 30%,#03151e 62%,#020b11 100%);background-attachment:fixed}
  a{color:inherit;text-decoration:none} img{display:block}
  .mock-tag,.mock-back{position:fixed;top:16px;z-index:40;font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:rgba(180,230,255,.85);
    text-transform:uppercase;background:rgba(6,28,40,.55);border:1px solid rgba(150,210,240,.2);padding:7px 12px;border-radius:18px;backdrop-filter:blur(5px)}
  .mock-tag{left:16px}.mock-back{right:16px;color:var(--dim)}
  .wrap{max-width:1080px;margin:0 auto;padding:78px 6vw 80px}
  .eyebrow{font-family:var(--head);font-size:.56rem;letter-spacing:5px;color:#9fe6ff;text-transform:uppercase}
  .hero{padding:8vh 0 6vh}
  .hero .name{font-family:var(--head);font-weight:700;font-size:clamp(2.4rem,6vw,3.8rem);line-height:1.08;letter-spacing:-1px;margin:16px 0;text-shadow:0 0 50px rgba(120,210,255,.35)}
  .hero .epigraph{font-style:italic;font-size:1.2rem;color:#bfe9ff;max-width:520px;line-height:1.5;margin-bottom:22px}
  .actions{display:flex;gap:12px;flex-wrap:wrap}
  /* the flOw membrane: soft rounded glowing panel */
  .pill{background:linear-gradient(160deg,rgba(140,210,245,.14),rgba(8,32,46,.3));border:1px solid rgba(150,210,240,.22);
    color:var(--ink);font-family:var(--head);font-size:.52rem;letter-spacing:2px;padding:13px 22px;border-radius:30px;text-transform:uppercase;
    backdrop-filter:blur(6px);transition:.4s cubic-bezier(.22,1,.36,1);cursor:pointer}
  .pill:hover{box-shadow:0 0 28px rgba(140,220,255,.3);border-color:rgba(180,230,255,.6);transform:translateY(-2px)}
  .shead{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:5vh 0 26px}
  .shead h2{font-family:var(--head);font-size:1.4rem;font-weight:700;text-transform:uppercase;letter-spacing:-.5px;text-shadow:0 0 26px rgba(140,210,255,.3)}
  .filters{display:flex;gap:9px;flex-wrap:wrap}
  .chip{font-family:var(--head);font-size:.48rem;letter-spacing:2px;text-transform:uppercase;background:rgba(140,210,245,.06);
    border:1px solid rgba(150,210,240,.2);color:var(--dim);padding:9px 15px;border-radius:20px;transition:.3s;cursor:pointer}
  .chip:hover{color:var(--ink)} .chip.on{background:rgba(150,225,255,.9);color:#04202e;border-color:transparent;box-shadow:0 0 18px rgba(150,225,255,.5)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:20px}
  .card{--rc:var(--cyan);position:relative;border-radius:24px;overflow:hidden;text-align:left;border:1px solid rgba(150,210,240,.18);
    background:linear-gradient(165deg,color-mix(in srgb,var(--rc) 14%,rgba(8,30,44,.55)),rgba(4,18,28,.7));
    backdrop-filter:blur(6px);transition:.45s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;cursor:pointer}
  .card:hover{transform:translateY(-6px);box-shadow:0 18px 50px rgba(0,0,0,.4),0 0 40px color-mix(in srgb,var(--rc) 28%,transparent);border-color:color-mix(in srgb,var(--rc) 55%,transparent)}
  .card .thumb{height:140px;overflow:hidden;position:relative;border-radius:24px 24px 0 0}
  .card .thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.85) brightness(.8);transition:.6s}
  .card:hover .thumb img{filter:none;transform:scale(1.05)}
  .card .thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,transparent 40%,color-mix(in srgb,var(--rc) 30%,transparent))}
  .card .b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:7px}
  .card .m{font-family:var(--head);font-size:.46rem;letter-spacing:2px;color:var(--rc);text-transform:uppercase}
  .card .t{font-weight:600;font-size:1.02rem;line-height:1.25}
  .card .r{font-size:.82rem;color:var(--dim)}
  .card.dim{opacity:.18;filter:saturate(.3)}
  .traits-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .trait{--rc:var(--cyan);border-radius:18px;padding:18px 20px;border:1px solid rgba(150,210,240,.18);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 12%,rgba(8,30,44,.4)),rgba(4,18,28,.5))}
  .trait .tn{font-weight:600;font-size:.95rem;color:var(--rc);margin-bottom:5px} .trait .tc{font-family:var(--head);font-size:.48rem;letter-spacing:2px;color:var(--dim)}
  .tl{display:flex;gap:30px;padding:16px 0;border-bottom:1px solid rgba(150,210,240,.12)}
  .tl .w{width:150px;flex-shrink:0;font-family:var(--head);font-size:.52rem;letter-spacing:2px;color:#9fe6ff}
  .tl .h{font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:.95rem;margin-bottom:5px}
  .tl .d{font-size:.9rem;color:var(--dim);line-height:1.6}
  /* detail */
  .detail{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.4s}
  .detail.open{opacity:1;pointer-events:auto}
  .detail .s{position:absolute;inset:0;background:rgba(3,16,24,.6);backdrop-filter:blur(8px)}
  .detail .p{--rc:var(--cyan);position:relative;width:min(620px,92vw);max-height:88vh;overflow:auto;border-radius:28px;padding:34px 38px;
    background:linear-gradient(165deg,color-mix(in srgb,var(--rc) 16%,rgba(8,32,46,.94)),rgba(3,14,22,.96));border:1px solid color-mix(in srgb,var(--rc) 40%,transparent);box-shadow:0 0 80px color-mix(in srgb,var(--rc) 26%,transparent)}
  .detail .m{font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:var(--rc);text-transform:uppercase;margin-bottom:12px}
  .detail h2{font-family:var(--head);font-size:1.6rem;text-transform:uppercase;letter-spacing:-.5px;margin-bottom:16px}
  .detail .by{font-size:1.05rem;line-height:1.7;margin-bottom:14px} .detail .st{color:var(--dim);line-height:1.7}
  .detail .x{position:absolute;top:14px;right:18px;cursor:pointer;font-family:var(--head);font-size:.5rem;letter-spacing:2px;color:var(--dim)}
</style>
</head>
<body>
<div class="mock-tag">∿ flOw style · Membrane</div><a class="mock-back" href="./styles.html">↑ Style chooser</a>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">Game &amp; Technical Designer</div>
    <h1 class="name">Giuseppe Alfieri</h1>
    <p class="epigraph">"I design games where the systems tell the story. The world doesn't exist until you scan it into memory."</p>
    <div class="actions"><button class="pill">Copy Email</button><a class="pill" href="#">GitHub</a><a class="pill" href="#">View CV</a></div>
  </section>
  <section>
    <div class="shead"><h2>The Work</h2><div class="filters" id="filters"></div></div>
    <div class="grid" id="grid"></div>
  </section>
  <section>
    <div class="shead"><h2>Disciplines</h2></div>
    <div class="traits-row" id="traits"></div>
  </section>
  <section>
    <div class="shead"><h2>Lineage</h2></div>
    <div id="lineage"></div>
  </section>
</div>
<div class="detail" id="detail"></div>
<script src="./mock-data.js"></script>
<script>
  const RCV={'Game Designer':'var(--cyan)','Technical Game Designer':'var(--amber)','Leadership':'var(--violet)','Game Programmer':'var(--aqua)'};
  const rcv=r=>RCV[r]||'var(--cyan)';
  document.getElementById('grid').innerHTML=DATA.map(p=>`<button class="card" data-id="${p.id}" data-cat="${p.cat}" style="--rc:${rcv(p.role)}">
    <div class="thumb"><img src="${p.img}" alt=""></div><div class="b"><div class="m">${p.cat} · ${p.year}</div><div class="t">${p.title}</div><div class="r">${p.role}</div></div></button>`).join('');
  document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openD(c.dataset.id)));
  const filters=['ALL',...CATS];
  document.getElementById('filters').innerHTML=filters.map((f,i)=>`<button class="chip ${i?'':'on'}" data-cat="${f}">${f==='PROFESSIONAL'?'PRO':f==='UNIVERSITY'?'UNI':f}</button>`).join('');
  document.querySelectorAll('#filters .chip').forEach(b=>b.addEventListener('click',()=>{ document.querySelectorAll('#filters .chip').forEach(x=>x.classList.toggle('on',x===b));
    document.querySelectorAll('.card').forEach(c=>c.classList.toggle('dim',b.dataset.cat!=='ALL'&&c.dataset.cat!==b.dataset.cat)); }));
  const tc=traitCounts();
  document.getElementById('traits').innerHTML=Object.keys(RCV).map(r=>`<div class="trait" style="--rc:${rcv(r)}"><div class="tn">${r}</div><div class="tc">${String(tc[r]).padStart(2,'0')} SPECIMENS</div></div>`).join('');
  document.getElementById('lineage').innerHTML=LINEAGE.map(l=>`<div class="tl"><div class="w">[ ${l.when} ]</div><div><div class="h">${l.what}</div><div class="d">${l.where}</div></div></div>`).join('');
  function openD(id){ const p=DATA.find(x=>x.id===id); const d=document.getElementById('detail');
    d.innerHTML=`<div class="s"></div><div class="p" style="--rc:${rcv(p.role)}"><span class="x">RELEASE ✕</span><div class="m">◎ ${p.cat} · ${p.year} · ${p.role}</div><h2>${p.title}</h2><p class="by">${p.blurb}</p><p class="st">${p.story}</p></div>`;
    requestAnimationFrame(()=>d.classList.add('open'));
    d.addEventListener('click',e=>{ if(e.target===d||e.target.classList.contains('s')||e.target.classList.contains('x')) d.classList.remove('open'); }); }
</script>
</body>
</html>
