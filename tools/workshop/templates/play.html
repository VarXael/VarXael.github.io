<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- GENERATED by tools/build-content.mjs from the project's card in the vault. Do not edit. -->
<title>{{TITLE}}: play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--void:#08090a;--panel:#0e1012;--ink:#e7e6e1;--dim:rgba(231,230,225,.58);--faint:rgba(231,230,225,.12);--ice:#9fd8ff;--amber:#f0a640;
  --serif:'Cormorant Garamond',serif;--mono:'IBM Plex Mono',monospace;--sans:Inter,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--void)}
body{color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.top{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 40px;background:rgba(8,9,10,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--faint)}
.top a{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}.top a:hover{color:var(--ice)}
.top .brand{color:var(--ink);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:0 40px 110px}
.hero{padding:64px 0 32px;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:end}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.4rem,5vw,4.4rem);line-height:.95;margin:14px 0 0}
.lede{font-size:1.02rem;line-height:1.7;color:rgba(231,230,225,.86)}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--faint);margin-top:16px}
.tab{padding:14px 22px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}.tab[aria-selected="true"]{color:var(--ice);border-bottom-color:var(--ice)}
.stage{position:relative;margin-top:24px;border:1px solid var(--faint);background:#050607;aspect-ratio:16/9;overflow:hidden}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 55%,rgba(159,216,255,.08),transparent 60%)}
.cover h2{font-family:var(--serif);font-weight:300;font-size:2.1rem}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:12px 18px;border:1px solid var(--faint);display:inline-block;transition:.25s}
.btn:hover{border-color:var(--ice);color:var(--ice)}
.btn.solid{background:var(--ice);border-color:var(--ice);color:var(--void);font-weight:500}.btn.solid:hover{background:var(--ink);border-color:var(--ink)}
.under{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:12px}
.under a:hover{color:var(--ice)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.notes{margin-top:56px;max-width:780px;line-height:1.75;color:rgba(231,230,225,.86)}
.notes h3,.notes h4{font-family:var(--serif);font-weight:300;font-size:1.7rem;color:var(--ink);margin:28px 0 10px}
.notes p{margin:10px 0}.notes ul,.notes ol{margin:10px 0 10px 20px}
.notes table{width:100%;border-collapse:collapse;font-size:.92rem;margin:12px 0}
.notes th,.notes td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--faint);vertical-align:top}
.notes th{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:400}
.notes b{color:var(--ink);font-weight:500}.notes code{font-family:var(--mono);font-size:.85em;color:var(--ice)}
.phone{display:none;margin-top:16px;padding:16px;border:1px solid var(--faint);background:var(--panel);color:var(--dim);line-height:1.6}
@media (max-width:820px){.top{padding:14px 16px}main{padding:0 16px 80px}.hero{grid-template-columns:1fr;gap:18px;padding-top:40px}.stage{aspect-ratio:4/3}.phone{display:block}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="../../index.html">G. Alfieri</a><a href="../../lab.html">The Lab</a></header>
<main>
  <section class="hero">
    <div><span class="mono" id="ctx"></span><h1 id="title"></h1></div>
    <p class="lede" id="lede"></p>
  </section>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="stage" id="stage">
    <div class="cover" id="cover">
      <span class="mono" id="build-label"></span>
      <h2 id="cover-title"></h2>
      <div class="row"><button class="btn solid" id="play">Play in the browser</button><span id="dl"></span></div>
      <span class="mono">About 40 MB to load the first time · keyboard and mouse · desktop browser</span>
    </div>
  </div>
  <div class="under"><span class="mono">Click the game once to give it the keyboard.</span><a class="mono" id="full" href="#" target="_blank" rel="noopener">Open full screen ↗</a></div>
  <p class="phone">This build needs a keyboard and a mouse; it is best played on a computer.</p>
  <section class="notes" id="notes"></section>
</main>
<script>
const PLAY = {{DATA}};
const $ = id => document.getElementById(id);
$('ctx').textContent = PLAY.context; $('title').textContent = PLAY.title; $('lede').textContent = PLAY.short;
$('cover-title').textContent = PLAY.title; $('notes').innerHTML = PLAY.notes;
let cur = 0;
function show(i) {
  cur = i; const b = PLAY.builds[i];
  const old = $('stage').querySelector('iframe'); if (old) old.remove();
  $('cover').style.display = '';
  $('build-label').textContent = PLAY.builds.length > 1 ? b.label : 'Playable build';
  $('full').href = `./${b.slug}/index.html`;
  const dls = PLAY.downloads.filter(d => PLAY.builds.length === 1 || d.label.startsWith(b.label));
  $('dl').innerHTML = dls.map(d => `<a class="btn" href="${d.url}">${d.label.replace(b.label + ' · ', '')}</a>`).join(' ');
  document.querySelectorAll('.tab').forEach((t, k) => t.setAttribute('aria-selected', k === i));
}
$('tabs').innerHTML = PLAY.builds.length > 1 ? PLAY.builds.map((b, i) => `<button class="tab" role="tab" data-i="${i}">${b.label}</button>`).join('') : '';
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => show(+t.dataset.i)));
$('play').addEventListener('click', () => {
  const f = document.createElement('iframe');
  f.src = `./${PLAY.builds[cur].slug}/index.html`; f.title = PLAY.title; f.allow = 'autoplay; fullscreen';
  $('stage').appendChild(f); $('cover').style.display = 'none';
  f.addEventListener('load', () => { try { f.focus(); } catch (e) {} });
});
show(0);
</script>
</body>
