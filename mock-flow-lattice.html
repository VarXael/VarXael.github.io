<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOCK · Flow · Lattice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Work+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./mock-shared.css">
<style>
  /* ============================================================
     CONCEPT 3 — "FLOW · LATTICE"
     The flOw fantasy made literal as a living nervous system.
     This is the aesthetic pilot for synapse P4 (2.5D layered-Z).
     - The portfolio IS a graph: a central CORE (Giuseppe), four
       TRAIT nodes (the disciplines) on an inner ring, and PROJECT
       orbs on an outer ring. Filaments connect everything.
     - The flOw "descent" here is DEPTH OF FOCUS along the Z axis:
       the lattice lives in 3D. You swim closer to a node and it
       snaps into focus; the rest of the graph recedes into a blur
       (verified focus math, applied to z-depth). You "consume a
       layer" by approaching it: a trait node you focus on pulls
       its projects toward you and dims the rest (dim-don't-hide).
     - A SIGNAL pulses along the filaments — bioluminescent light
       travels from the core outward to the trait you are focusing,
       then onward to that trait's projects. This is the flOw
       creature's trail reimagined as data flowing through a mind.
     - Clicking a project orb blooms its detail surface in-world.
     - No traditional HUD. The only readout is a single depth
       number that whispers in a corner. The graph speaks for itself.
     This is throwaway concept code, not the real build.
     ============================================================ */
  html,body{height:100%;overflow:hidden;cursor:none}
  body{background:var(--abyss)}

  .stage{position:fixed;inset:0;z-index:5;overflow:hidden;perspective:1400px}
  .lattice{position:absolute;left:50%;top:50%;width:0;height:0;
    transform-style:preserve-3d;transition:transform 1.1s var(--ease)}
  .lattice.free{transition:none}

  /* SVG filaments sit on a flat layer behind the 3D nodes */
  .filaments{position:absolute;left:0;top:0;width:1600px;height:1200px;transform:translate(-50%,-50%);
    overflow:visible;pointer-events:none}
  .fil{stroke:var(--lum-faint);stroke-width:1;fill:none;transition:stroke .5s,stroke-width .5s,filter .5s}
  .fil.lit{stroke:var(--rc);stroke-width:1.8;filter:drop-shadow(0 0 4px var(--rc))}
  .fil.dim{stroke:rgba(180,230,255,.04)}

  /* nodes live in 3D space */
  .node{position:absolute;left:50%;top:50%;transform-style:preserve-3d;
    background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:8px;
    cursor:none;transition:filter .6s var(--ease);text-align:center}
  .node .orb{border-radius:50%;border:1px solid var(--rc,var(--lum-soft));
    background:radial-gradient(circle,color-mix(in srgb,var(--rc,#b4e6ff) 22%,rgba(3,9,13,.7)),rgba(3,9,13,.85));
    box-shadow:0 0 18px color-mix(in srgb,var(--rc,#b4e6ff) 30%,transparent);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    transition:box-shadow .5s,border-color .5s,transform .5s var(--ease);transform:translate(-50%,-50%)}
  .node .lbl{font-family:var(--head);font-size:.5rem;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--ink);max-width:140px;line-height:1.3;transform:translate(-50%,-50%);position:absolute;left:50%;top:50%;margin-top:0}
  .node .sub{font-family:var(--head);font-size:.4rem;letter-spacing:1px;color:var(--rc,var(--lum));opacity:.85;transform:translate(-50%,-50%);position:absolute;left:50%;top:50%}

  /* the node holds orb + label as siblings, positioned via 3D translate */
  .node .orb-wrap{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
  .node .lbl-wrap{position:absolute;left:0;top:0;transform:translate(-50%,-50%);margin-top:0;display:flex;flex-direction:column;align-items:center;gap:4px}

  /* core node */
  .node.core .orb{width:150px;height:150px;border-color:var(--lum);
    box-shadow:0 0 38px rgba(180,230,255,.4),inset 0 0 30px rgba(180,230,255,.1)}
  .node.core .lbl{font-family:var(--head);font-size:.7rem;letter-spacing:2px;color:var(--lum-bright);text-shadow:0 0 16px rgba(180,230,255,.5)}

  /* trait node */
  .node.trait .orb{width:80px;height:80px}
  .node.trait.focused .orb{box-shadow:0 0 42px var(--rc);border-color:var(--rc);
    transform:translate(-50%,-50%) scale(1.12)}
  .node.trait .lbl{color:var(--rc)}

  /* project node */
  .node.proj .orb{width:104px;height:104px}
  .node.proj .orb img{width:100%;height:100%;object-fit:cover;opacity:.65;filter:grayscale(.4);transition:.5s}
  .node.proj:hover .orb img,.node.proj.focused .orb img{opacity:1;filter:none}
  .node.proj.focused .orb{border-color:var(--rc);box-shadow:0 0 30px color-mix(in srgb,var(--rc) 50%,transparent)}

  /* lineage node (off to the side, deeper) */
  .node.lineage .orb{width:84px;height:84px;border-color:#7dffd0}

  /* depth-of-focus classes applied per node based on z-distance to camera */
  .node.focus{filter:none}
  .node.near{filter:blur(4px);opacity:.4}
  .node.far{filter:blur(8px);opacity:.12}
  .node.gone{opacity:0}

  /* the camera depth readout — the only chrome */
  .depth-whisper{position:fixed;bottom:20px;left:24px;z-index:30;font-family:var(--head);
    font-size:.5rem;letter-spacing:3px;color:var(--lum-soft);opacity:.5;transition:.5s;pointer-events:none}
  .depth-whisper b{color:var(--lum);text-shadow:0 0 8px rgba(180,230,255,.5)}

  .hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;font-family:var(--head);
    font-size:.46rem;letter-spacing:3px;color:var(--dim);text-transform:uppercase;opacity:0;transition:1s;pointer-events:none}
  .hint.show{opacity:.6}

  /* signal pulse canvas (drawn over filaments) */
  canvas#pulse{position:fixed;inset:0;z-index:8;pointer-events:none;width:100%;height:100%}

  /* cursor: a faint reticle (you are observing the lattice) */
  canvas#reticle{position:fixed;inset:0;z-index:60;pointer-events:none;width:100%;height:100%}

  /* diegetic detail bloom */
  .detail{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;opacity:0;
    pointer-events:none;transition:opacity .6s var(--ease)}
  .detail.open{opacity:1;pointer-events:auto}
  .detail .scrim{position:absolute;inset:0;background:rgba(2,6,9,.72);backdrop-filter:blur(7px)}
  .detail .panel{--rc:var(--lum);position:relative;width:min(660px,90vw);max-height:86vh;overflow-y:auto;
    background:linear-gradient(160deg,rgba(8,26,34,.92),rgba(3,9,13,.96));
    border:1px solid color-mix(in srgb,var(--rc) 40%,var(--lum-faint));border-radius:20px;
    box-shadow:0 0 100px color-mix(in srgb,var(--rc) 16%,transparent);transform:scale(.9) translateZ(60px);transition:transform .7s var(--ease)}
  .detail.open .panel{transform:scale(1) translateZ(0)}
  .detail .pmedia{height:210px;background:#000;overflow:hidden;border-radius:20px 20px 0 0}
  .detail .pmedia img{width:100%;height:100%;object-fit:cover;filter:grayscale(.15)}
  .detail .pinner{padding:26px 30px 32px}
  .detail .pmeta{font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:var(--rc);text-transform:uppercase;margin-bottom:12px;opacity:.9}
  .detail .ptitle{font-family:var(--head);font-size:1.6rem;text-transform:uppercase;letter-spacing:-.5px;color:var(--lum-bright);margin-bottom:16px;text-shadow:0 0 26px rgba(180,230,255,.3)}
  .detail .pblurb{font-size:1.05rem;line-height:1.7;margin-bottom:16px}
  .detail .pstory{font-size:.95rem;line-height:1.8;color:var(--dim);border-left:1px solid color-mix(in srgb,var(--rc) 35%,transparent);padding-left:16px;margin-bottom:20px}
  .detail .pclose{position:absolute;top:14px;right:16px;background:rgba(3,9,13,.6);border:1px solid var(--lum-faint);color:var(--dim);font-family:var(--head);font-size:.46rem;letter-spacing:2px;padding:8px 13px;border-radius:16px;transition:.3s}
  .detail .pclose:hover{color:var(--lum);border-color:var(--lum)}
  .detail .btn,.detail .pclose{cursor:none}

  @media(prefers-reduced-motion:reduce){ .lattice,.node{transition:opacity .2s linear,filter .2s linear} }
  @media(pointer:coarse){ html,body{cursor:auto} .node,.btn,.pclose{cursor:pointer} }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div class="depth-fog" id="fog" style="opacity:.16"></div>
<div class="vignette"></div>

<div class="mock-tag">★ Flow · Lattice</div>
<a class="mock-back" href="./mock.html">↑ All mockups</a>

<div class="stage" id="stage">
  <svg class="filaments" id="filaments" viewBox="0 0 1600 1200"></svg>
  <div class="lattice" id="lattice"></div>
</div>

<canvas id="pulse"></canvas>
<canvas id="reticle"></canvas>

<div class="depth-whisper" id="depthWhisper">FOCUS <b id="fNum">CORE</b></div>
<div class="hint" id="hint">drag to orbit · scroll to dive · click a node</div>

<script src="./mock-data.js"></script>
<script>
  mockSea();

  const lattice = document.getElementById('lattice');
  const filaments = document.getElementById('filaments');
  const stage = document.getElementById('stage');
  const fog = document.getElementById('fog');
  const fNum = document.getElementById('fNum');
  const hint = document.getElementById('hint');

  const roles = Object.keys(RC);
  const W = 1600, H = 1200, CX = 800, CY = 600;

  // node positions in lattice-local space (centered at 0,0; the lattice is centered on screen)
  const corePos = { x:0, y:0, z:0 };
  const traitPos = {};
  roles.forEach((r,i)=>{
    const a = -Math.PI/2 + i/roles.length*Math.PI*2;
    traitPos[r] = { x: Math.cos(a)*230, y: Math.sin(a)*230, z: 60 };
  });
  const projPos = {};
  DATA.forEach((p,i)=>{
    const a = -Math.PI/2 + i/DATA.length*Math.PI*2 + 0.3;
    projPos[p.id] = { x: Math.cos(a)*470, y: Math.sin(a)*470, z: 120 + (i%2)*40 };
  });
  const lineagePos = { x:0, y:560, z:200 };

  /* ---------- build filaments (in SVG world coords; lattice center maps to 800,600) ---------- */
  let fh = '';
  // core -> traits
  roles.forEach(r=>{ const t=traitPos[r]; fh += `<line class="fil" data-role="${r}" style="--rc:${RC[r]}" x1="${CX}" y1="${CY}" x2="${CX+t.x}" y2="${CY+t.y}"/>`; });
  // traits -> their projects
  DATA.forEach(p=>{ const pr=projPos[p.id]; const t=traitPos[p.role]; fh += `<line class="fil proj" data-role="${p.role}" data-proj="${p.id}" style="--rc:${RC[p.role]}" x1="${CX+t.x}" y1="${CY+t.y}" x2="${CX+pr.x}" y2="${CY+pr.y}"/>`; });
  // core -> lineage
  fh += `<line class="fil" data-role="lineage" style="--rc:#7dffd0" x1="${CX}" y1="${CY}" x2="${CX+lineagePos.x}" y2="${CY+lineagePos.y}"/>`;
  filaments.innerHTML = fh;

  /* ---------- build 3D nodes ---------- */
  function makeNode(cls, pos, inner, rc){
    const n = document.createElement('button');
    n.className = 'node '+cls;
    n.style.transform = `translate3d(${pos.x}px, ${pos.y}px, ${pos.z}px)`;
    if(rc) n.style.setProperty('--rc', rc);
    n.innerHTML = inner;
    lattice.appendChild(n);
    return n;
  }

  // core
  makeNode('core', corePos, `
    <div class="orb-wrap"><div class="orb"></div></div>
    <div class="lbl-wrap" style="margin-top:96px">
      <div class="lbl">Giuseppe Alfieri</div>
      <div class="sub" style="--rc:#b4e6ff">THE CORE</div>
    </div>`, '#b4e6ff');

  // traits
  const traitNodes = {};
  roles.forEach(r=>{
    const n = makeNode('trait', traitPos[r], `
      <div class="orb-wrap"><div class="orb"></div></div>
      <div class="lbl-wrap" style="margin-top:60px">
        <div class="lbl">${r}</div>
      </div>`, RC[r]);
    n.dataset.role = r;
    n.addEventListener('click', ()=>focusTrait(r));
    traitNodes[r] = n;
  });

  // projects
  const projNodes = {};
  DATA.forEach(p=>{
    const rc = roleColor(p.role);
    const n = makeNode('proj', projPos[p.id], `
      <div class="orb-wrap"><div class="orb"><img src="${p.img}" alt="${p.title}"></div></div>
      <div class="lbl-wrap" style="margin-top:74px">
        <div class="lbl">${p.title}</div>
        <div class="sub">${p.year}</div>
      </div>`, rc);
    n.dataset.id = p.id;
    n.dataset.role = p.role;
    n.addEventListener('click', ()=>openDetail(p.id));
    projNodes[p.id] = n;
  });

  // lineage
  const lineageNode = makeNode('lineage', lineagePos, `
    <div class="orb-wrap"><div class="orb"></div></div>
    <div class="lbl-wrap" style="margin-top:64px">
      <div class="lbl">Lineage</div>
      <div class="sub" style="--rc:#7dffd0">ORIGINS</div>
    </div>`, '#7dffd0');
  lineageNode.addEventListener('click', openLineage);

  /* ---------- camera: orbit (rotateY/X) + dive (translateZ) ---------- */
  let rotY=0, rotX=0, camZ=0;
  let targetRotY=0, targetRotX=0, targetCamZ=0;
  let dragging=false, sx=0, sy=0, moved=false;

  function applyCam(){
    lattice.style.transform = `translateZ(${camZ}px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  }

  stage.addEventListener('pointerdown', e=>{
    if(e.target.closest('.node,.btn,.pclose')) return;
    dragging=true; moved=false; sx=e.clientX; sy=e.clientY; lattice.classList.add('free');
  });
  addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    targetRotY += dx*0.25; targetRotX -= dy*0.25;
    targetRotX = Math.max(-40, Math.min(40, targetRotX));
    sx=e.clientX; sy=e.clientY;
  });
  addEventListener('pointerup', ()=>{ dragging=false; lattice.classList.remove('free'); });

  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    targetCamZ += e.deltaY < 0 ? 140 : -140;
    targetCamZ = Math.max(-700, Math.min(900, targetCamZ));
  }, {passive:false});

  addEventListener('keydown', e=>{
    if(e.key==='ArrowRight') targetRotY+=8;
    else if(e.key==='ArrowLeft') targetRotY-=8;
    else if(e.key==='ArrowUp'){ targetCamZ+=100; }
    else if(e.key==='ArrowDown'){ targetCamZ-=100; }
  });

  /* ---------- focus logic: which node is closest to camera ---------- */
  let activeTrait = null;
  function focusTrait(r){
    activeTrait = activeTrait===r ? null : r;
    Object.entries(traitNodes).forEach(([k,n])=>n.classList.toggle('focused', k===activeTrait));
    // dim-don't-hide projects not of this trait
    Object.entries(projNodes).forEach(([k,n])=>{
      n.classList.toggle('focused', false);
      n.style.opacity = (activeTrait && n.dataset.role!==activeTrait) ? '.16' : '';
      n.style.filter = (activeTrait && n.dataset.role!==activeTrait) ? 'blur(3px) saturate(.3)' : '';
    });
    // light filaments
    filaments.querySelectorAll('.fil').forEach(f=>{
      f.classList.remove('lit','dim');
      if(activeTrait){
        if(f.dataset.role===activeTrait) f.classList.add('lit');
        else f.classList.add('dim');
      }
    });
    fNum.textContent = activeTrait ? activeTrait.toUpperCase() : 'CORE';
    // emit a pulse along the lit filaments
    if(activeTrait) emitPulse(activeTrait);
  }

  function openLineage(){
    const html = `<div class="pinner"><div class="pmeta" style="--rc:#7dffd0">◎ LINEAGE · ORIGINS</div><div class="ptitle">Where it started</div>${LINEAGE.map(l=>`<div class="tl-item"><div class="tl-when">[ ${l.when} ]</div><div><div class="tl-what">${l.what}</div><div class="tl-where">${l.where}</div></div></div>`).join('')}</div>`;
    let d=document.querySelector('.detail.custom'); if(!d){ d=document.createElement('div'); d.className='detail custom'; document.body.appendChild(d); d.addEventListener('click',e=>{ if(e.target===d||e.target.classList.contains('scrim')||e.target.classList.contains('pclose')) d.classList.remove('open'); }); }
    d.innerHTML=`<div class="scrim"></div><div class="panel" style="--rc:#7dffd0"><button class="pclose">RELEASE ✕</button>${html}</div>`;
    requestAnimationFrame(()=>d.classList.add('open'));
  }

  /* ---------- signal pulses traveling the filaments ---------- */
  const pulseCv = document.getElementById('pulse');
  const pg = pulseCv.getContext('2d');
  let PW, PH;
  function pResize(){ PW=pulseCv.width=innerWidth; PH=pulseCv.height=innerHeight; }
  addEventListener('resize',pResize); pResize();

  const pulses = [];   // each: { x1,y1,x2,y2 (screen coords), t, life, rc }
  function emitPulse(role){
    // from core to trait, then trait to each project of that role
    const coreScreen = nodeScreenPos({x:0,y:0,z:0});
    const traitScreen = nodeScreenPos(traitPos[role]);
    pulses.push({ x1:coreScreen.x,y1:coreScreen.y, x2:traitScreen.x,y2:traitScreen.y, t:0, life:60, rc:RC[role] });
    DATA.filter(p=>p.role===role).forEach(p=>{
      const ps = nodeScreenPos(projPos[p.id]);
      setTimeout(()=>pulses.push({ x1:traitScreen.x,y1:traitScreen.y, x2:ps.x,y2:ps.y, t:0, life:60, rc:RC[role] }), 400);
    });
  }
  // transform a lattice-local point to screen coords (approx, using current camera)
  function nodeScreenPos(pos){
    // apply lattice transform: translateZ + rotateX + rotateY, then project
    const z = pos.z + camZ;
    let x = pos.x, y = pos.y;
    // rotateY
    const ry = rotY*Math.PI/180;
    let x1 = x*Math.cos(ry) + z*Math.sin(ry);
    let z1 = -x*Math.sin(ry) + z*Math.cos(ry);
    // rotateX
    const rx = rotX*Math.PI/180;
    let y1 = y*Math.cos(rx) - z1*Math.sin(rx);
    let z2 = y*Math.sin(rx) + z1*Math.cos(rx);
    // perspective project: lattice is centered at screen center
    const persp = 1400;
    const scale = persp / (persp - z2);
    return { x: innerWidth/2 + x1*scale, y: innerHeight/2 + y1*scale, scale };
  }

  function drawPulses(){
    pg.clearRect(0,0,PW,PH);
    pg.globalCompositeOperation='lighter';
    for(let i=pulses.length-1;i>=0;i--){
      const p = pulses[i];
      p.t++;
      const prog = p.t/p.life;
      if(prog>=1){ pulses.splice(i,1); continue; }
      const x = p.x1 + (p.x2-p.x1)*prog;
      const y = p.y1 + (p.y2-p.y1)*prog;
      const a = Math.sin(prog*Math.PI) * 0.9;
      const grd = pg.createRadialGradient(x,y,0,x,y,14);
      grd.addColorStop(0, hexToRgba(p.rc, a));
      grd.addColorStop(1, hexToRgba(p.rc, 0));
      pg.fillStyle = grd;
      pg.beginPath(); pg.arc(x,y,14,0,6.2832); pg.fill();
      pg.fillStyle = hexToRgba(p.rc, a);
      pg.beginPath(); pg.arc(x,y,2,0,6.2832); pg.fill();
    }
    pg.globalCompositeOperation='source-over';
  }
  function hexToRgba(hex,a){
    // accept #rrggbb
    if(hex.startsWith('var')){
      // fallback
      return `rgba(180,230,255,${a})`;
    }
    const h = hex.replace('#','');
    const r=parseInt(h.substr(0,2),16), g=parseInt(h.substr(2,2),16), b=parseInt(h.substr(4,2),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  /* ---------- reticle cursor ---------- */
  const rCv = document.getElementById('reticle');
  const rg = rCv.getContext('2d');
  let RW,RH, mx=innerWidth/2, my=innerHeight/2;
  function rResize(){ RW=rCv.width=innerWidth; RH=rCv.height=innerHeight; }
  addEventListener('resize',rResize); rResize();
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  function drawReticle(){
    rg.clearRect(0,0,RW,RH);
    rg.globalCompositeOperation='lighter';
    // faint crosshair ring
    rg.strokeStyle='rgba(180,230,255,.25)';
    rg.lineWidth=1;
    rg.beginPath(); rg.arc(mx,my,18,0,6.2832); rg.stroke();
    rg.strokeStyle='rgba(180,230,255,.12)';
    rg.beginPath(); rg.arc(mx,my,32,0,6.2832); rg.stroke();
    // center dot
    rg.fillStyle='rgba(223,244,255,.7)';
    rg.beginPath(); rg.arc(mx,my,1.8,0,6.2832); rg.fill();
    rg.globalCompositeOperation='source-over';
  }

  /* ---------- main loop ---------- */
  let t=0;
  function loop(){
    t++;
    // ease camera toward targets
    rotY += (targetRotY-rotY)*0.10;
    rotX += (targetRotX-rotX)*0.10;
    camZ += (targetCamZ-camZ)*0.10;
    applyCam();
    drawPulses();
    drawReticle();
    // gentle ambient pulse every ~5s from core
    if(t % 300 === 0){
      // emit a faint pulse from core to a random trait
      const r = roles[Math.floor(Math.random()*roles.length)];
      const coreScreen = nodeScreenPos({x:0,y:0,z:0});
      const traitScreen = nodeScreenPos(traitPos[r]);
      pulses.push({ x1:coreScreen.x,y1:coreScreen.y, x2:traitScreen.x,y2:traitScreen.y, t:0, life:80, rc:RC[r] });
    }
    document.hidden ? setTimeout(loop,220) : requestAnimationFrame(loop);
  }
  loop();

  // show hint briefly
  hint.classList.add('show');
  setTimeout(()=>hint.classList.remove('show'), 7000);
</script>
</body>
</html>
