<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single-Sided Business Card PNG Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Include the html2canvas library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --card-width: 8.5cm;
            --card-height: 5.5cm;
            --mono: 'Space Mono', monospace;
            --sans: 'Inter', sans-serif;
            --bg-color: #0a0b0d;
            --primary-text-color: #e8e6e0;
            --accent-color: #4fb8d4;
            --amber: #e0a23b;
            --faint: rgba(232,230,224,0.16);
            --light-gray: rgba(232,230,224,0.5);
        }

        /* --- Page & Button Setup --- */
        body {
            font-family: var(--sans);
            background-color: #050608;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .download-button {
            font-family: var(--mono);
            background: none;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 14px 28px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }
        .download-button:hover { background: var(--accent-color); color: var(--bg-color); }

        /* --- Final Card Layout --- */
        .card {
            width: var(--card-width);
            height: var(--card-height);
            background-color: var(--bg-color);
            color: var(--primary-text-color);
            border: 1px solid var(--faint);
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
            position: relative;
        }
        .card::before{
            content:"";position:absolute;inset:4px;border:1px solid rgba(232,230,224,0.05);pointer-events:none;
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px dashed var(--faint);
            padding-bottom: 9px;
            flex-shrink: 0;
        }

        .photo {
            width: 48px;
            height: 48px;
            border: 1px solid var(--accent-color);
            object-fit: cover;
            filter: grayscale(1) contrast(1.05);
            flex-shrink: 0;
        }

        .identity .name {
            font-family: var(--mono);
            font-size: 12.5pt;
            font-weight: 700;
            margin: 0;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .identity .title {
            font-family: var(--mono);
            font-size: 7.5pt;
            font-weight: 400;
            color: var(--accent-color);
            margin: 4px 0 0 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .content-section {
            display: flex;
            justify-content: space-between;
            flex-grow: 1;
            padding-top: 10px;
            align-items: flex-start;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 8pt;
            font-family: var(--mono);
        }
        .contact-item .icon {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
            color: var(--accent-color);
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .qr-code {
            width: 50px;
            height: 50px;
            border: 1px solid var(--faint);
            background: #fff;
            padding: 2px;
        }
        .website-url {
            font-size: 7.5pt;
            font-family: var(--mono);
            letter-spacing: 1px;
            color: var(--primary-text-color);
        }

        .footer {
            flex-shrink: 0;
            text-align: center;
            padding-top: 7px;
            margin-top: auto;
            border-top: 1px dashed var(--faint);
        }
        .footer p {
            font-size: 7pt;
            font-family: var(--mono);
            color: var(--light-gray);
            margin: 0;
            letter-spacing: 1px;
        }

    </style>
</head>
<body>
    
    <button id="download-btn" class="download-button">Download Card as PNG</button>

    <!-- Single-Sided Card -->
    <div id="single-card" class="card">
        <div class="header-section">
            <img src="./assets/images/about.png" alt="Photo of Giuseppe" class="photo">
            <div class="identity">
                <h1 class="name">Giuseppe Luigi Alfieri</h1>
                <p class="title">Technical Game Designer</p>
            </div>
        </div>
        <div class="content-section">
            <div class="contact-info">
                <div class="contact-item">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg>
                    <span>+39 3927207595</span>
                </div>
                <div class="contact-item">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M20,8L12,13L4,8V6L12,11L20,6M20,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V6C22,4.89 21.1,4 20,4Z" /></svg>
                    <span>giuseppeluigi.alfieri@gmail.com</span>
                </div>
                <!-- === GITHUB LINK ADDED HERE === -->
                <div class="contact-item">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12C2,16.42 4.87,20.17 8.84,21.5C9.34,21.58 9.5,21.27 9.5,21V19.21C6.73,19.64 6.14,17.97 6.14,17.97C5.68,16.81 5.03,16.5 5.03,16.5C4.12,15.88 5.1,15.9 5.1,15.9C6.1,15.97 6.63,16.93 6.63,16.93C7.5,18.45 8.97,18 9.54,17.76C9.63,17.11 9.89,16.67 10.17,16.42C7.95,16.17 5.62,15.31 5.62,11.5C5.62,10.39 6,9.5 6.65,8.79C6.55,8.54 6.2,7.5 6.75,6.15C6.75,6.15 7.59,5.88 9.5,7.17C10.29,6.95 11.15,6.84 12,6.84C12.85,6.84 13.71,6.95 14.5,7.17C16.41,5.88 17.25,6.15 17.25,6.15C17.8,7.5 17.45,8.54 17.35,8.79C18,9.5 18.38,10.39 18.38,11.5C18.38,15.32 16.04,16.16 13.83,16.41C14.17,16.72 14.5,17.33 14.5,18.26V21C14.5,21.27 14.66,21.59 15.17,21.5C19.14,20.16 22,16.42 22,12A10,10 0 0,0 12,2Z" /></svg>
                    <span>github.com/VarXael</span>
                </div>
            </div>
            <div class="qr-section">
                <img src="./assets/images/qr-code.png" alt="QR Code for Portfolio" class="qr-code">
                <p class="website-url">varxael.github.io</p>
            </div>
        </div>
        <div class="footer">
            <p>Happy to talk about anything Unreal Engine :)</p>
        </div>
    </div>

    <script>
        document.getElementById('download-btn').addEventListener('click', () => {
            const cardElement = document.getElementById('single-card');
            const options = { 
                scale: 4, 
                useCORS: true, 
                backgroundColor: '#0a0b0d'
            };

            html2canvas(cardElement, options).then(canvas => {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = 'business_card_single_sided.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        });
    </script>

</body>
</html>
