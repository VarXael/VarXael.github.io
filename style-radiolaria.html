<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiolaria Style · Specimen Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Work+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#04090d;--ink:#e9f4fb;--dim:rgba(233,244,251,.55);--lum:#b4e6ff;--head:'Syncopate',sans-serif;--body:'Work Sans',sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--body);color:var(--ink);background:radial-gradient(120% 90% at 80% 50%,#07151d 0%,#04090d 55%)}
  #bg{position:fixed;inset:0;z-index:0;opacity:.5}
  .mock-tag,.mock-back{position:fixed;top:16px;z-index:40;font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:rgba(180,230,255,.85);
    text-transform:uppercase;background:rgba(6,20,28,.5);border:1px solid rgba(150,210,240,.18);padding:7px 12px;border-radius:16px}
  .mock-tag{left:16px}.mock-back{right:16px;color:var(--dim)}
  .sheet{position:fixed;inset:0;z-index:5;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:40px;padding:8vh 7vw}
  .left{max-width:560px}
  .brand{font-family:var(--head);font-size:.5rem;letter-spacing:4px;color:var(--dim);text-transform:uppercase;margin-bottom:26px}
  .title{font-family:var(--head);font-weight:700;font-size:clamp(2rem,4.4vw,3.2rem);line-height:1.04;letter-spacing:-1px;color:#eaf6ff;text-shadow:0 0 40px rgba(140,210,255,.25)}
  .sub{font-family:var(--head);font-size:.6rem;letter-spacing:5px;color:var(--rc,var(--lum));text-transform:uppercase;margin:14px 0 36px}
  .facet{margin-bottom:26px;position:relative;padding-left:20px}
  .facet::before{content:"";position:absolute;left:0;top:6px;width:8px;height:8px;border-radius:50%;background:var(--rc,var(--lum));box-shadow:0 0 12px var(--rc,var(--lum))}
  .facet h3{font-family:var(--head);font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:#dff2ff;margin-bottom:9px}
  .facet p{font-size:.92rem;line-height:1.7;color:var(--dim);max-width:440px}
  .right{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
  #scope{width:min(60vh,540px);height:min(60vh,540px)}
  /* specimen switcher */
  .switch{position:fixed;left:7vw;bottom:6vh;z-index:10;display:flex;align-items:center;gap:18px}
  .switch button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(150,210,240,.25);background:rgba(6,20,28,.6);color:var(--lum);font-size:1rem;cursor:pointer;transition:.3s}
  .switch button:hover{border-color:var(--lum);box-shadow:0 0 16px rgba(180,230,255,.3)}
  .switch .idx{font-family:var(--head);font-size:.56rem;letter-spacing:3px;color:var(--dim)}
  .switch .idx b{color:var(--lum)}
  .observe{position:fixed;right:7vw;bottom:6vh;z-index:10;font-family:var(--head);font-size:.52rem;letter-spacing:2px;color:var(--lum);
    text-transform:uppercase;border:1px solid rgba(150,210,240,.3);padding:11px 18px;border-radius:20px;background:rgba(6,20,28,.5);cursor:pointer;transition:.3s}
  .observe:hover{border-color:var(--lum);box-shadow:0 0 18px rgba(180,230,255,.25)}
  @media(max-width:880px){ .sheet{grid-template-columns:1fr;overflow-y:auto} .right{height:46vh} }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="mock-tag">◇ Radiolaria style · Specimen Sheet</div><a class="mock-back" href="./styles.html">↑ Style chooser</a>
<div class="sheet">
  <div class="left">
    <div class="brand">G.ALFIERI // Specimen Observation Log</div>
    <h1 class="title" id="title">—</h1>
    <div class="sub" id="sub">—</div>
    <div class="facet" style="--rc:var(--rc)"><h3>The System</h3><p id="f1">—</p></div>
    <div class="facet" style="--rc:var(--rc)"><h3>The Role</h3><p id="f2">—</p></div>
    <div class="facet" style="--rc:var(--rc)"><h3>The Story</h3><p id="f3">—</p></div>
  </div>
  <div class="right"><canvas id="scope"></canvas></div>
</div>
<div class="switch"><button id="prev">‹</button><div class="idx">SPECIMEN <b id="ix">01</b> / 06</div><button id="next">›</button></div>
<button class="observe" id="observe">◎ Observe in full</button>

<script src="./mock-data.js"></script>
<script>
  const COL={'Game Designer':'#7fe3ff','Technical Game Designer':'#ffc478','Leadership':'#e096ff','Game Programmer':'#78ffcd'};
  let i=0;
  // background plankton
  (function bg(){ const c=document.getElementById('bg'),x=c.getContext('2d'); let W,H,t=0,pk=[];
    function rs(){W=c.width=innerWidth;H=c.height=innerHeight;pk=[];for(let k=0;k<90;k++)pk.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.6,vy:-.04-Math.random()*.12,ph:Math.random()*6.28});}
    addEventListener('resize',rs);rs();
    (function f(){t++;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';for(const p of pk){p.y+=p.vy;if(p.y<-6){p.y=H+6;p.x=Math.random()*W;}const tw=.4+.6*Math.sin(t*.03+p.ph);x.fillStyle=`rgba(180,230,255,${.3*tw})`;x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill();}x.globalCompositeOperation='source-over';document.hidden?setTimeout(f,200):requestAnimationFrame(f);})();
  })();
  // the radiolaria diagram
  const sc=document.getElementById('scope'), g=sc.getContext('2d'); let SW,t=0,col=[127,227,255];
  function rs2(){const s=Math.min(innerHeight*.6,540);sc.width=sc.height=s*devicePixelRatio;sc.style.width=sc.style.height=s+'px';g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);SW=s;}
  addEventListener('resize',rs2);rs2();
  function hexrgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  function draw(){ t++; const cx=SW/2,cy=SW/2,R=SW*.38,[r,gn,b]=col, L=(a)=>`rgba(${r},${gn},${b},${a})`;
    g.clearRect(0,0,SW,SW); g.globalCompositeOperation='lighter';
    [1,.78,.56,.34].forEach((rk,k)=>{g.lineWidth=k===1?1.4:.8;g.setLineDash(k===1?[3,9]:[]);g.strokeStyle=L(.22);g.beginPath();g.arc(cx,cy,R*rk,0,6.28);g.stroke();});
    g.setLineDash([]);
    for(let k=0;k<16;k++){const a=t*.003+k/16*6.28;const x1=cx+Math.cos(a)*R*.34,y1=cy+Math.sin(a)*R*.34,x2=cx+Math.cos(a)*R*1.12,y2=cy+Math.sin(a)*R*1.12;
      const gr=g.createLinearGradient(x1,y1,x2,y2);gr.addColorStop(0,L(0));gr.addColorStop(.5,L(.25));gr.addColorStop(1,L(0));g.strokeStyle=gr;g.lineWidth=1;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
      const pul=.5+.5*Math.sin(t*.05+k);g.fillStyle=L(.3+.5*pul);g.beginPath();g.arc(cx+Math.cos(a)*R,cy+Math.sin(a)*R,1.8,0,6.28);g.fill();}
    const cg=g.createRadialGradient(cx,cy,0,cx,cy,R*.6);cg.addColorStop(0,'rgba(255,255,255,.95)');cg.addColorStop(.25,L(.6));cg.addColorStop(1,L(0));g.fillStyle=cg;g.beginPath();g.arc(cx,cy,R*.6,0,6.28);g.fill();
    g.globalCompositeOperation='source-over';document.hidden?setTimeout(draw,120):requestAnimationFrame(draw);
  }
  draw();
  function render(){ const p=DATA[i], c=COL[p.role]||'#b4e6ff'; col=hexrgb(c);
    document.documentElement.style.setProperty('--rc',c);
    document.getElementById('title').textContent=p.title;
    document.getElementById('sub').textContent=`${p.cat} · ${p.year} · ${p.role}`;
    document.getElementById('sub').style.color=c;
    document.getElementById('f1').textContent=p.blurb;
    document.getElementById('f2').textContent=`${p.role}. A self-contained system taken from concept to a working build.`;
    document.getElementById('f3').textContent=p.story;
    document.getElementById('ix').textContent=String(i+1).padStart(2,'0');
    document.querySelectorAll('.facet').forEach(f=>f.style.setProperty('--rc',c));
  }
  document.getElementById('prev').onclick=()=>{i=(i+DATA.length-1)%DATA.length;render();};
  document.getElementById('next').onclick=()=>{i=(i+1)%DATA.length;render();};
  document.getElementById('observe').onclick=()=>openDetail(DATA[i].id);
  addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();else if(e.key==='ArrowLeft')document.getElementById('prev').click();});
  render();
</script>
</body>
</html>
