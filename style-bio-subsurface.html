<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio · Subsurface</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Work+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eaf6ff;--dim:rgba(234,246,255,.6);--cyan:#7fe3ff;--gold:#e8c074;--head:'Syncopate',sans-serif;--body:'Work Sans',sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--body);color:var(--ink);cursor:none;background:linear-gradient(180deg,#0e4358 0%,#08303f 18%,#04202c 40%,#021019 66%,#01080e 100%)}
  #c{position:fixed;inset:0;z-index:1}
  .tag,.back{position:fixed;top:18px;z-index:40;font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:rgba(180,230,255,.85);text-transform:uppercase;background:rgba(4,18,26,.4);border:1px solid rgba(150,210,240,.18);padding:7px 12px;border-radius:18px;backdrop-filter:blur(4px)}
  .tag{left:18px}.back{right:18px;color:var(--dim)}
  /* a single translucent glass panel floating in the water (counter-illumination under-glow) */
  .panel{position:fixed;left:7vw;top:50%;transform:translateY(-50%);z-index:10;width:min(420px,84vw);padding:34px 36px 30px;border-radius:18px;
    background:linear-gradient(160deg,rgba(20,55,72,.32),rgba(4,20,30,.42));border:1px solid rgba(150,210,240,.2);backdrop-filter:blur(9px);
    box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 60px rgba(127,227,255,.08),inset 0 1px 0 rgba(255,255,255,.08)}
  .panel::after{content:"";position:absolute;left:10%;right:10%;bottom:-14px;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(127,227,255,.18),transparent);filter:blur(4px)}
  .eyebrow{font-family:var(--head);font-size:.54rem;letter-spacing:5px;color:#9fe6ff;text-transform:uppercase;margin-bottom:14px}
  .name{font-family:var(--head);font-weight:700;font-size:clamp(2rem,4.6vw,3rem);line-height:1.08;letter-spacing:-1px;text-shadow:0 0 50px rgba(127,227,255,.4)}
  .epigraph{font-style:italic;font-size:1.05rem;color:#cfecff;line-height:1.5;margin:16px 0 22px}
  .work{display:flex;flex-direction:column;gap:2px}
  .work .wh{font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
  .row{--rc:var(--cyan);display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid rgba(150,210,240,.1);cursor:pointer;transition:.3s}
  .row:hover{padding-left:12px}.row .d{width:8px;height:8px;border-radius:50%;background:var(--rc);box-shadow:0 0 10px var(--rc),0 0 3px #fff;flex-shrink:0}
  .row .t{flex:1;font-weight:500;font-size:.92rem}.row .y{font-family:var(--head);font-size:.46rem;letter-spacing:2px;color:var(--dim)}
  .row:hover .t{color:var(--rc)}
  .hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
  .detail{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.4s}
  .detail.open{opacity:1;pointer-events:auto}.detail .s{position:absolute;inset:0;background:rgba(2,14,22,.55);backdrop-filter:blur(10px)}
  .detail .p{--rc:var(--cyan);position:relative;width:min(560px,92vw);padding:34px 38px;border-radius:22px;background:linear-gradient(160deg,rgba(20,55,72,.6),rgba(3,16,24,.92));border:1px solid color-mix(in srgb,var(--rc) 40%,transparent);box-shadow:0 0 80px color-mix(in srgb,var(--rc) 24%,transparent)}
  .detail .m{font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:var(--rc);text-transform:uppercase;margin-bottom:12px}
  .detail h2{font-family:var(--head);font-size:1.5rem;text-transform:uppercase;letter-spacing:-.5px;margin-bottom:14px}
  .detail .by{font-size:1.02rem;line-height:1.7;margin-bottom:12px}.detail .st{color:var(--dim);line-height:1.7}
  .detail .x{position:absolute;top:14px;right:18px;cursor:pointer;font-family:var(--head);font-size:.5rem;letter-spacing:2px;color:var(--dim)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tag">≋ Bio · Subsurface</div><a class="back" href="./styles.html">↑ Style chooser</a>
<div class="panel">
  <div class="eyebrow">Game &amp; Technical Designer</div>
  <h1 class="name">Giuseppe Alfieri</h1>
  <p class="epigraph">"The systems tell the story. The world doesn't exist until you scan it into memory."</p>
  <div class="work"><div class="wh">◎ The Work</div><div id="rows"></div></div>
</div>
<div class="hint">move through the water · the school follows your light</div>
<div class="detail" id="detail"></div>
<script src="./mock-data.js"></script>
<script>
  const RCC={'Game Designer':[127,227,255],'Technical Game Designer':[255,210,122],'Leadership':[230,168,255],'Game Programmer':[125,255,208]};
  const rc=r=>RCC[r]||[127,227,255];
  document.getElementById('rows').innerHTML=DATA.map(p=>{const c=rc(p.role);return `<div class="row" data-id="${p.id}" style="--rc:rgb(${c[0]},${c[1]},${c[2]})"><span class="d"></span><span class="t">${p.title}</span><span class="y">${p.year}</span></div>`;}).join('');
  document.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>openD(r.dataset.id)));
  function openD(id){const p=DATA.find(x=>x.id===id),c=rc(p.role),d=document.getElementById('detail');d.innerHTML=`<div class="s"></div><div class="p" style="--rc:rgb(${c[0]},${c[1]},${c[2]})"><span class="x">RELEASE ✕</span><div class="m">◎ ${p.cat} · ${p.year} · ${p.role}</div><h2>${p.title}</h2><p class="by">${p.blurb}</p><p class="st">${p.story}</p></div>`;requestAnimationFrame(()=>d.classList.add('open'));d.addEventListener('click',e=>{if(e.target===d||e.target.classList.contains('s')||e.target.classList.contains('x'))d.classList.remove('open');});}
  // ENVIRONMENT
  const cv=document.getElementById('c'),g=cv.getContext('2d');let W,H,t=0,mx=innerWidth*.6,my=innerHeight*.5,cx=mx,cy=my;
  const school=[],wake=[],COLS=[[127,227,255],[125,255,208],[180,235,255]];
  function seed(){school.length=0;const N=Math.min(60,Math.round(W*H/30000));for(let i=0;i<N;i++)school.push({x:Math.random()*W,y:Math.random()*H,vx:-.5+Math.random(),vy:-.5+Math.random(),c:COLS[i%COLS.length],sz:1+Math.random()*2});}
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;seed();}addEventListener('resize',rs);rs();
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;if(Math.random()<.5)wake.push({x:e.clientX,y:e.clientY,life:1,r:2+Math.random()*3});});
  const R=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
  function biolight(x,y,r,c,k){let gr=g.createRadialGradient(x,y,0,x,y,r*2.4);gr.addColorStop(0,R(c,.16*k));gr.addColorStop(1,R(c,0));g.fillStyle=gr;g.beginPath();g.arc(x,y,r*2.4,0,6.28);g.fill();gr=g.createRadialGradient(x,y,0,x,y,r*.6);gr.addColorStop(0,`rgba(240,250,255,${.9*k})`);gr.addColorStop(.5,R(c,.6*k));gr.addColorStop(1,R(c,0));g.fillStyle=gr;g.beginPath();g.arc(x,y,r*.6,0,6.28);g.fill();}
  function frame(){if(W!==innerWidth||H!==innerHeight)rs();t++;cx+=(mx-cx)*.08;cy+=(my-cy)*.08;
    g.clearRect(0,0,W,H);g.globalCompositeOperation='lighter';
    // god-ray shafts from the surface
    for(let i=0;i<4;i++){const x=W*(0.2+i*0.22)+Math.sin(t*.004+i*2)*50;const gr=g.createLinearGradient(x,0,x-150,H);gr.addColorStop(0,'rgba(150,225,255,.07)');gr.addColorStop(1,'rgba(150,225,255,0)');g.fillStyle=gr;g.beginPath();g.moveTo(x-40,0);g.lineTo(x+60,0);g.lineTo(x-150,H);g.lineTo(x-250,H);g.closePath();g.fill();}
    // caustic shimmer near the top
    for(let i=0;i<5;i++){const x=(i/5)*W+Math.sin(t*.01+i)*80,y=Math.abs(Math.sin(t*.008+i*1.5))*H*.3;biolight(x,y,40,[150,225,255],.06);}
    // wake particles (your trail)
    for(let k=wake.length-1;k>=0;k--){const p=wake[k];p.life-=.02;p.y-=.3;if(p.life<=0){wake.splice(k,1);continue;}biolight(p.x,p.y,p.r,[170,235,255],p.life*.5);}
    // the school: flock + follow the cursor light
    school.forEach((b,i)=>{let ax=0,ay=0,n=0,sx=0,sy=0;for(let k=0;k<10;k++){const o=school[(i*7+k*11+1)%school.length];const dx=o.x-b.x,dy=o.y-b.y,d=dx*dx+dy*dy;if(d<8000&&d>0){ax+=o.vx;ay+=o.vy;if(d<700){sx-=dx;sy-=dy;}n++;}}if(n){b.vx+=(ax/n-b.vx)*.04+sx*.001;b.vy+=(ay/n-b.vy)*.04+sy*.001;}
      const dx=cx-b.x,dy=cy-b.y,dm=Math.hypot(dx,dy);if(dm<300){const f=.04*(1-dm/300);b.vx+=dx/dm*f*(dm<70?-1.5:1);b.vy+=dy/dm*f*(dm<70?-1.5:1);}
      const sp=Math.hypot(b.vx,b.vy);if(sp>2.6){b.vx=b.vx/sp*2.6;b.vy=b.vy/sp*2.6;}b.x+=b.vx;b.y+=b.vy;
      if(b.x<-20)b.x=W+20;else if(b.x>W+20)b.x=-20;if(b.y<-20)b.y=H+20;else if(b.y>H+20)b.y=-20;
      biolight(b.x,b.y,b.sz*2.6,b.c,.6+.3*Math.sin(t*.05+i));});
    // your light
    biolight(cx,cy,18,[180,235,255],.5);
    g.globalCompositeOperation='source-over';document.hidden?setTimeout(frame,180):requestAnimationFrame(frame);}
  frame();
</script>
</body>
</html>
