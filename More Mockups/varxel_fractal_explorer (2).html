<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VarXel_OS | Fractal Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300;500;700&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --void-deep: #00001a;
            --void-light: #001133;
            --glow-white: #ffffff;
            --glow-cyan: #aaddff;
            --hud-line: rgba(170, 221, 255, 0.15);
            --hud-hover: rgba(170, 221, 255, 0.4);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 60% 50%, var(--void-light) 0%, var(--void-deep) 100%);
            font-family: 'Space Grotesk', sans-serif;
            color: var(--glow-white);
            overflow: hidden;
            user-select: none;
        }

        canvas {
            position: fixed; top: 0; left: 0; z-index: 0;
            cursor: crosshair;
        }

        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; padding: 3rem; box-sizing: border-box;
        }

        /* Left Side: Directory HUD */
        .hud-left {
            pointer-events: auto;
            display: flex; flex-direction: column;
            width: 340px;
            border-right: 1px solid var(--hud-line);
            padding-right: 2rem;
            background: linear-gradient(90deg, rgba(0,0,26,0.8) 0%, transparent 100%);
            /* Blur backdrop to ensure text is readable over canvas */
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .sys-header {
            font-family: 'Jura', sans-serif;
            font-size: 2rem; font-weight: 300; letter-spacing: 0.2em;
            color: var(--glow-white);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            margin-bottom: 5px; line-height: 1;
        }

        .sys-sub {
            font-size: 0.65rem; letter-spacing: 4px; color: var(--glow-cyan);
            text-transform: uppercase; margin-bottom: 2rem; opacity: 0.7;
        }

        /* Collapsible Tree Styling */
        .folder-tree {
            display: flex; flex-direction: column; gap: 4px;
            overflow-y: auto; overflow-x: hidden;
            scrollbar-width: thin; scrollbar-color: var(--hud-hover) transparent;
        }
        
        .folder-tree::-webkit-scrollbar { width: 4px; }
        .folder-tree::-webkit-scrollbar-thumb { background: var(--hud-hover); border-radius: 4px; }

        .tree-item-container {
            display: flex; flex-direction: column;
        }

        .tree-item {
            font-size: 0.8rem; letter-spacing: 1px; color: rgba(170, 221, 255, 0.7);
            cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; gap: 8px;
            padding: 6px 0; border-radius: 4px;
        }

        .tree-item:hover { color: var(--glow-white); background: rgba(170, 221, 255, 0.05); }
        
        .tree-item.active {
            color: var(--glow-white); font-weight: 600;
            text-shadow: 0 0 10px rgba(170, 221, 255, 0.5);
        }

        /* Connecting lines for the tree view */
        .tree-icon {
            font-size: 0.6rem; width: 12px; text-align: center;
            color: var(--glow-cyan); opacity: 0.8;
        }
        
        .tree-icon.file { font-size: 0.8rem; }
    </style>
</head>
<body>
    <canvas id="radial-canvas"></canvas>

    <div class="ui-layer">
        <div class="hud-left">
            <div>
                <div class="sys-header">NEXUS_FS</div>
                <div class="sys-sub">Fractal Topography</div>
            </div>
            
            <div class="folder-tree" id="sidebar-tree"></div>

            <div style="margin-top: auto;">
                <div style="font-size: 0.65rem; color: var(--hud-line); letter-spacing: 2px; border-top: 1px solid var(--hud-line); padding-top: 15px;">
                    CAMERA: [<span id="cam-coords">0.0, 0.0</span>]<br>
                    NODES RENDERED: <span id="node-count">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock File System with recursive structure
        const fileSystem = {
            id: "root", name: "VarXel_Core", type: "folder", expanded: true, depth: 0,
            children: [
                { id: "sys", name: "System32", type: "folder", expanded: false,
                    children: [
                        { id: "k1", name: "kernel.sys", type: "file", size: "12MB" },
                        { id: "k2", name: "boot.ini", type: "file", size: "4KB" },
                        { id: "k3", name: "drivers", type: "folder", expanded: false, children: [
                            { id: "d_net", name: "net.drv", type: "file", size: "1MB" },
                            { id: "d_gpu", name: "gpu.drv", type: "file", size: "8MB" }
                        ]}
                    ]
                },
                { id: "usr", name: "Users", type: "folder", expanded: false,
                    children: [
                        { id: "u1", name: "Kira_Chen", type: "folder", expanded: false, children: [
                            { id: "d1", name: "Projects", type: "folder", expanded: false, children: [
                                { id: "p1", name: "Aethel_Dynamics.exe", type: "file", size: "1.2GB" },
                                { id: "p2", name: "Radiolaria_UI.zip", type: "file", size: "450MB" },
                                { id: "p3", name: "mockups", type: "folder", expanded: false, children: [
                                    { id: "m1", name: "v1.html", type: "file" },
                                    { id: "m2", name: "v2.html", type: "file" }
                                ]}
                            ]},
                            { id: "d2", name: "Archives", type: "folder", expanded: false, children: [] }
                        ]},
                        { id: "u2", name: "Guest", type: "folder", expanded: false, children: [] }
                    ]
                },
                { id: "cfg", name: "Config", type: "folder", expanded: false,
                    children: [
                        { id: "c1", name: "ui_theme.yaml", type: "file", size: "128KB" },
                        { id: "c2", name: "network.conf", type: "file", size: "16KB" }
                    ]
                },
                { id: "log", name: "Logs", type: "folder", expanded: false,
                    children: [
                        { id: "l1", name: "error.log", type: "file", size: "2MB" },
                        { id: "l2", name: "access.log", type: "file", size: "14MB" },
                        { id: "l3", name: "sys_dump.bin", type: "file", size: "4GB" }
                    ]
                },
                { id: "bin", name: "Binaries", type: "folder", expanded: false, children: [] }
            ]
        };

        // --- Core State & Canvas Setup ---
        const canvas = document.getElementById('radial-canvas');
        const ctx = canvas.getContext('2d');
        const sidebarTree = document.getElementById('sidebar-tree');
        let w, h;

        // Virtual Camera for panning across the fractal graph
        let camera = { x: 0, y: 0 };
        let targetCamera = { x: 0, y: 0 };
        let activeNode = fileSystem; // The node currently focused
        let flatNodes = []; // Flat array for easy hit detection and physics
        let time = 0;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        
        // Initialize mouse with safe window fallback
        let mouse = { x: window.innerWidth/2, y: window.innerHeight/2 };
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX; 
            mouse.y = e.clientY;
        });

        function toggleFolder(node) {
            if (node.type !== 'folder') return;
            node.expanded = !node.expanded;
            activeNode = node;
            
            updateGraphLayout();
            renderSidebar();
        }

        // Recursive rendering for the HTML sidebar
        function createTreeHTML(node, depth) {
            const container = document.createElement('div');
            container.className = 'tree-item-container';

            const item = document.createElement('div');
            item.className = `tree-item ${activeNode === node ? 'active' : ''}`;
            item.style.paddingLeft = `${depth * 15}px`;

            // Icons
            const icon = document.createElement('span');
            if (node.type === 'folder') {
                icon.className = 'tree-icon';
                icon.innerText = node.expanded ? '▼' : '▶';
            } else {
                icon.className = 'tree-icon file';
                icon.innerText = '●';
            }
            
            const text = document.createElement('span');
            text.innerText = node.name;

            item.appendChild(icon);
            item.appendChild(text);
            
            item.onclick = (e) => {
                e.stopPropagation();
                if(node.type === 'folder') toggleFolder(node);
                else {
                    activeNode = node;
                    renderSidebar();
                }
            };
            
            container.appendChild(item);

            if (node.type === 'folder' && node.expanded && node.children) {
                node.children.forEach(child => {
                    container.appendChild(createTreeHTML(child, depth + 1));
                });
            }

            return container;
        }

        function renderSidebar() {
            sidebarTree.innerHTML = '';
            sidebarTree.appendChild(createTreeHTML(fileSystem, 0));
        }

        // Calculate TARGET spatial positions. Physics engine will pull nodes here.
        function calculateNodePositions(node, parent, x, y, depth, incomingAngle) {
            node.targetX = x;
            node.targetY = y;
            node.depth = depth;
            
            // If the node doesn't have physical coordinates yet (newly spawned),
            // start it at its parent's location so it "blooms" outward.
            if (node.x === undefined) {
                node.x = parent ? parent.x : x;
                node.y = parent ? parent.y : y;
                node.vx = (Math.random() - 0.5) * 5; // Slight random kick
                node.vy = (Math.random() - 0.5) * 5;
            }
            
            // Add to flat array for rendering and physics
            flatNodes.push(node);

            if (node.type === 'folder' && node.expanded && node.children && node.children.length > 0) {
                const count = node.children.length;
                
                // Base radius shrinks slightly as depth increases
                const radius = 280 * Math.pow(0.85, depth); 
                
                // If it's the root, fan out 360 degrees. Otherwise, fan out forward (140 degrees)
                const isRoot = depth === 0;
                const spreadAngle = isRoot ? Math.PI * 2 : Math.PI * 0.8;
                
                let startAngle = incomingAngle - spreadAngle / 2;
                if (isRoot) startAngle = 0;

                node.children.forEach((child, i) => {
                    let angle;
                    if (count === 1) {
                        angle = incomingAngle;
                    } else if (isRoot) {
                        angle = (Math.PI * 2) * (i / count);
                    } else {
                        angle = startAngle + (spreadAngle * (i / (count - 1)));
                    }

                    let childX = x + Math.cos(angle) * radius;
                    let childY = y + Math.sin(angle) * radius;

                    calculateNodePositions(child, node, childX, childY, depth + 1, angle);
                });
            }
        }

        function updateGraphLayout() {
            flatNodes = [];
            calculateNodePositions(fileSystem, null, 0, 0, 0, 0);
            document.getElementById('node-count').innerText = flatNodes.length;
        }

        // Initialize structure
        resize();
        updateGraphLayout();
        renderSidebar();

        // Canvas click detection utilizing physical coordinates
        canvas.addEventListener('mousedown', (e) => {
            const worldX = e.clientX + camera.x;
            const worldY = e.clientY + camera.y;

            let closest = null;
            let minDist = 30;

            flatNodes.forEach(node => {
                let dist = Math.hypot(worldX - node.x, worldY - node.y);
                if (dist < minDist) {
                    minDist = dist;
                    closest = node;
                }
            });

            if (closest) {
                if(closest.type === 'folder') toggleFolder(closest);
                else {
                    activeNode = closest;
                    renderSidebar();
                }
            }
        });

        function drawPetal(parent, child, breath) {
            ctx.save();
            ctx.translate(parent.x, parent.y);
            
            // Dynamically calculate angle and distance based on real-time physical positions
            let dx = child.x - parent.x;
            let dy = child.y - parent.y;
            let dist = Math.hypot(dx, dy);
            let angle = Math.atan2(dy, dx);
            
            // Rotate to face the child
            ctx.rotate(angle - Math.PI/2);
            
            // Draw sweeping loop (Elastic Tentacle)
            ctx.beginPath();
            ctx.moveTo(0, 0);
            // The signature fl0w sweeping bezier curve, dynamically adapting to distance
            ctx.bezierCurveTo(dist * 0.4, dist * 0.8, dist * -0.4, dist * 0.8, 0, dist);
            
            ctx.strokeStyle = 'rgba(170, 221, 255, 0.25)';
            if (child === activeNode || parent === activeNode) {
                ctx.strokeStyle = 'rgba(170, 221, 255, 0.6)';
                ctx.lineWidth = 2;
            } else {
                ctx.lineWidth = 1;
            }
            ctx.stroke();
            
            ctx.restore();
        }

        function drawNode(node, breath) {
            ctx.save();
            ctx.translate(node.x, node.y);

            let isHovered = Math.hypot((mouse.x + camera.x) - node.x, (mouse.y + camera.y) - node.y) < 20;
            let isActive = node === activeNode;

            if (node.id === 'root') {
                ctx.shadowBlur = isActive ? 40 : 20;
                ctx.shadowColor = '#ffffff';
                ctx.beginPath(); ctx.arc(0, 0, 18 + breath*2, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff'; ctx.fill();

                ctx.shadowBlur = 10;
                ctx.strokeStyle = 'rgba(170, 221, 255, 0.4)';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(0, 0, 40 + breath*5, 0, Math.PI*2); ctx.stroke();
                ctx.setLineDash([4, 12]);
                ctx.beginPath(); ctx.arc(0, 0, 60 + breath*8, 0, Math.PI*2); ctx.stroke();
                
            } else if (node.type === 'folder') {
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI*2);
                ctx.strokeStyle = isActive || isHovered ? '#ffffff' : 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = isActive ? 2 : 1;
                if(isActive || isHovered) { ctx.shadowBlur = 15; ctx.shadowColor = '#fff'; }
                ctx.stroke();
                ctx.shadowBlur = 0;
                
                ctx.beginPath();
                ctx.arc(0, 0, 3, 0, Math.PI*2);
                ctx.fillStyle = node.expanded ? '#aaddff' : '#ffffff';
                ctx.fill();

                if(node.expanded) {
                    ctx.setLineDash([2, 6]);
                    ctx.beginPath();
                    ctx.arc(0, 0, 22 + breath*2, 0, Math.PI*2);
                    ctx.strokeStyle = 'rgba(170, 221, 255, 0.3)';
                    ctx.stroke();
                }
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI*2);
                ctx.fillStyle = isActive || isHovered ? '#ffffff' : '#aaddff';
                if(isActive || isHovered) { ctx.shadowBlur = 15; ctx.shadowColor = '#aaddff'; }
                ctx.fill();
            }

            ctx.restore();
            
            // Draw Label
            ctx.save();
            ctx.translate(node.x, node.y);
            
            ctx.font = isActive ? "600 12px 'Jura'" : "300 10px 'Jura'";
            ctx.fillStyle = isActive ? "#ffffff" : "rgba(170, 221, 255, 0.8)";
            ctx.textAlign = "center";
            ctx.shadowBlur = isActive ? 10 : 0;
            ctx.shadowColor = '#000000';
            
            let labelOffset = node.id === 'root' ? 85 : 25;
            ctx.fillText(node.name.toUpperCase(), 0, labelOffset);
            
            if (isActive || isHovered) {
                ctx.font = "300 8px 'Space Grotesk'";
                ctx.fillStyle = "rgba(170, 221, 255, 0.5)";
                let meta = node.type === 'folder' ? '[DIR]' : `[FILE: ${node.size || '0KB'}]`;
                ctx.fillText(meta, 0, labelOffset + 12);
            }
            ctx.restore();
        }

        function animate() {
            // Smooth clear for trail effect
            ctx.fillStyle = 'rgba(0, 0, 26, 0.4)';
            ctx.fillRect(0, 0, w, h);

            time += 0.02;
            let breath = Math.sin(time) * 1.5;

            // --- FLUID DYNAMICS & PHYSICS ENGINE ---
            flatNodes.forEach(node => {
                // 1. Structural Tension (Pull nodes towards their target layout positions)
                node.vx += (node.targetX - node.x) * 0.03;
                node.vy += (node.targetY - node.y) * 0.03;

                // 2. Collision Avoidance (Push nodes apart if they overlap)
                flatNodes.forEach(other => {
                    if (node !== other) {
                        let dx = node.x - other.x;
                        let dy = node.y - other.y;
                        let dist = Math.hypot(dx, dy);
                        let minDist = 150; // The personal space of a node
                        
                        // Avoid division by zero if nodes spawn on exact same pixel
                        if (dist === 0) { dx = (Math.random()-0.5); dy = (Math.random()-0.5); dist = 0.1; }
                        
                        if (dist < minDist) {
                            let repulsionForce = (minDist - dist) / minDist;
                            node.vx += (dx / dist) * repulsionForce * 2;
                            node.vy += (dy / dist) * repulsionForce * 2;
                        }
                    }
                });

                // 3. Amniotic Fluid Sway (Simulate underwater current)
                node.vx += Math.sin(time * 1.5 + node.depth) * 0.15;
                node.vy += Math.cos(time * 1.2 + node.id.length) * 0.15;

                // 4. Fluid Viscosity (Drag)
                node.vx *= 0.82;
                node.vy *= 0.82;

                // Apply velocities
                node.x += node.vx;
                node.y += node.vy;
            });

            // --- CAMERA TRACKING ---
            if (activeNode && activeNode.x !== undefined) {
                const sidebarWidth = 340;
                const availableWidth = w - sidebarWidth;
                targetCamera.x = activeNode.x - (sidebarWidth + availableWidth / 2);
                targetCamera.y = activeNode.y - (h / 2);
            }

            camera.x += (targetCamera.x - camera.x) * 0.05;
            camera.y += (targetCamera.y - camera.y) * 0.05;
            
            document.getElementById('cam-coords').innerText = `${Math.floor(camera.x)}, ${Math.floor(camera.y)}`;

            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // Draw Petals (Connections)
            flatNodes.forEach(node => {
                if (node.type === 'folder' && node.expanded && node.children) {
                    node.children.forEach(child => {
                        drawPetal(node, child, breath);
                    });
                }
            });

            // Draw Nodes
            flatNodes.forEach(node => {
                drawNode(node, breath);
            });

            ctx.restore();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
