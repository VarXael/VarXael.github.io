<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constellation Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300;600&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #00030a;
            background-image: radial-gradient(circle at 50% 50%, #000a1f 0%, #00030a 100%);
            font-family: 'Jura', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 0; cursor: crosshair; }

        .top-nav {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 2rem 3rem; display: flex; justify-content: space-between;
            z-index: 10; pointer-events: none;
        }

        .logo { font-size: 1.5rem; letter-spacing: 8px; font-weight: 600; text-shadow: 0 0 15px rgba(255,255,255,0.5); }
        .status { font-size: 0.7rem; letter-spacing: 3px; color: #66aaff; text-transform: uppercase; }

        /* Project Info Card (Hidden by default) */
        #project-info {
            position: absolute; bottom: 3rem; right: 3rem;
            width: 350px; background: rgba(0, 10, 31, 0.6);
            backdrop-filter: blur(10px); border: 1px solid rgba(170, 221, 255, 0.2);
            padding: 2rem; border-radius: 12px;
            opacity: 0; transform: translateY(20px);
            transition: all 0.4s ease; z-index: 10; pointer-events: none;
        }

        #project-info.visible { opacity: 1; transform: translateY(0); }
        .proj-title { font-size: 1.5rem; letter-spacing: 2px; margin-bottom: 10px; color: #fff; }
        .proj-desc { font-size: 0.85rem; line-height: 1.6; color: #aaddff; opacity: 0.8; }
    </style>
</head>
<body>
    <canvas id="constellation-canvas"></canvas>
    
    <div class="top-nav">
        <div class="logo">K.CHEN</div>
        <div class="status">EXPLORATION MODE // ACTIVE</div>
    </div>

    <div id="project-info">
        <div class="proj-title" id="p-title">Project Name</div>
        <div class="proj-desc" id="p-desc">Project description goes here. It details the technologies used and the conceptual framework.</div>
    </div>

    <script>
        const canvas = document.getElementById('constellation-canvas');
        const ctx = canvas.getContext('2d');
        const infoCard = document.getElementById('project-info');
        const pTitle = document.getElementById('p-title');
        const pDesc = document.getElementById('p-desc');
        let w, h;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let mouse = { x: -1000, y: -1000 };
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX; mouse.y = e.clientY;
        });

        const projects = [
            { title: "Aethel Dynamics", desc: "Procedural fluid simulation using WebGL and custom shaders." },
            { title: "Radiolaria UI", desc: "A micro-geometric interface designed for immersive VR data analysis." },
            { title: "Abyssal Audio", desc: "Generative soundscapes driven by cellular automata." },
            { title: "Void Architect", desc: "An experimental 3D modeling tool operating entirely in browser." },
            { title: "Echo Chamber", desc: "Visualizing social network echo chambers through physical gravity models." }
        ];

        class ProjectNode {
            constructor(data) {
                this.data = data;
                this.x = Math.random() * (w - 200) + 100;
                this.y = Math.random() * (h - 200) + 100;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.radius = 12;
                this.isHovered = false;
            }

            update() {
                this.x += this.vx; this.y += this.vy;
                
                if(this.x < 50 || this.x > w - 50) this.vx *= -1;
                if(this.y < 50 || this.y > h - 50) this.vy *= -1;

                let dist = Math.hypot(mouse.x - this.x, mouse.y - this.y);
                this.isHovered = dist < this.radius * 3;

                if (this.isHovered) {
                    infoCard.classList.add('visible');
                    pTitle.innerText = this.data.title;
                    pDesc.innerText = this.data.desc;
                }
            }

            draw() {
                ctx.shadowBlur = this.isHovered ? 20 : 10;
                ctx.shadowColor = '#ffffff';
                
                // Solid Inner
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = '#ffffff'; ctx.fill();

                // Outer Ring
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius + 8, 0, Math.PI*2);
                ctx.strokeStyle = this.isHovered ? '#ffffff' : 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1.5; ctx.stroke();
                
                ctx.shadowBlur = 0;
            }
        }

        const nodes = projects.map(p => new ProjectNode(p));
        let time = 0;

        function animate() {
            ctx.fillStyle = '#00030a';
            ctx.fillRect(0, 0, w, h);
            time += 0.01;

            // Check if any node is hovered to manage the UI card visibility globally
            if (!nodes.some(n => n.isHovered)) {
                infoCard.classList.remove('visible');
            }

            for(let i = 0; i < nodes.length; i++) {
                nodes[i].update();
                
                for(let j = i + 1; j < nodes.length; j++) {
                    let dist = Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y);

                    if (dist < 400) {
                        let opacity = 1 - (dist / 400);
                        // Highlight connections of hovered nodes
                        if(nodes[i].isHovered || nodes[j].isHovered) opacity = Math.max(opacity, 0.5);

                        ctx.strokeStyle = `rgba(170, 221, 255, ${opacity * 0.6})`;
                        ctx.lineWidth = (nodes[i].isHovered || nodes[j].isHovered) ? 2 : 1;
                        
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        
                        // Sweeping control point
                        let cpX = (nodes[i].x + nodes[j].x)/2 + Math.sin(time + i)*150;
                        let cpY = (nodes[i].y + nodes[j].y)/2 + Math.cos(time + j)*150;
                        
                        ctx.quadraticCurveTo(cpX, cpY, nodes[j].x, nodes[j].y);
                        ctx.stroke();
                        
                        // Midpoint tiny ring
                        let t = 0.5; // midpoint of quadratic curve
                        let midX = (1-t)*(1-t)*nodes[i].x + 2*(1-t)*t*cpX + t*t*nodes[j].x;
                        let midY = (1-t)*(1-t)*nodes[i].y + 2*(1-t)*t*cpY + t*t*nodes[j].y;
                        
                        ctx.beginPath(); ctx.arc(midX, midY, 4, 0, Math.PI*2);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`; ctx.stroke();
                    }
                }
                nodes[i].draw();
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
