<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card PNG Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Include the html2canvas library from a CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --card-width: 8.5cm;
            --card-height: 5.5cm;
            --mono: 'Space Mono', monospace;
            --sans: 'Inter', sans-serif;
            --bg-color: #0a0b0d;
            --primary-text-color: #e8e6e0;
            --accent-color: #4fb8d4;
            --faint: rgba(232,230,224,0.16);
        }

        /* --- Page & Button Setup --- */
        body {
            font-family: var(--sans);
            background-color: #050608;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .button-container {
            display: flex;
            gap: 1rem;
        }

        .download-button {
            font-family: var(--mono);
            background: none;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 14px 28px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }
        .download-button:hover { background: var(--accent-color); color: var(--bg-color); }

        /* --- Business Card Styling --- */
        .card {
            width: var(--card-width);
            height: var(--card-height);
            background-color: var(--bg-color);
            color: var(--primary-text-color);
            border: 1px solid var(--faint);
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }
        .card::before{
            content:"";position:absolute;inset:5px;border:1px solid rgba(232,230,224,0.06);pointer-events:none;
        }

        /* --- Front Side Specifics --- */
        .card-front {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 10px;
        }

        .photo { width: 64px; height: 64px; border: 1px solid var(--accent-color); object-fit: cover; margin-bottom: 12px; filter: grayscale(1) contrast(1.05); }
        .name { font-family: var(--mono); font-size: 15pt; font-weight: 700; margin: 0; line-height: 1.1; text-transform: uppercase; letter-spacing: 1px; }
        .title { font-family: var(--mono); font-size: 8.5pt; font-weight: 400; color: var(--accent-color); margin: 6px 0 14px 0; letter-spacing: 3px; text-transform: uppercase; }

        .contact-info {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 7px;
        }
        .contact-item { display: flex; align-items: center; gap: 8px; font-size: 8pt; font-family: var(--mono); }
        .contact-item .icon { width: 13px; height: 13px; flex-shrink: 0; color: var(--accent-color); }
        .contact-item span { word-break: break-all; }

        /* --- Back Side Specifics --- */
        .card-back {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .qr-code { width: 3.4cm; height: 3.4cm; border: 1px solid var(--faint); background: #fff; padding: 4px; }
        .website-url { margin-top: 10px; font-family: var(--mono); font-size: 9pt; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; }

    </style>
</head>
<body>
    
    <div class="button-container">
        <button id="download-front-btn" class="download-button">Download Front as PNG</button>
        <button id="download-back-btn" class="download-button">Download Back as PNG</button>
    </div>

    <!-- Card Front -->
    <div id="card-front" class="card card-front">
        <img src="./assets/images/about.png" alt="Giuseppe Luigi Alfieri" class="photo">
        <h1 class="name">Giuseppe Luigi Alfieri</h1>
        <p class="title">Technical Game Designer</p>
        <div class="contact-info">
            <div class="contact-item">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg>
                <span>+39 3927207595</span>
            </div>
            <div class="contact-item">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path d="M20,8L12,13L4,8V6L12,11L20,6M20,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V6C22,4.89 21.1,4 20,4Z" /></svg>
                <span>giuseppeluigi.alfieri@gmail.com</span>
            </div>
        </div>
    </div>

    <!-- Card Back -->
    <div id="card-back" class="card card-back">
        <img src="./assets/images/qr-code.png" alt="QR Code for Portfolio" class="qr-code">
        <p class="website-url">varxael.github.io</p>
    </div>

    <script>
        function downloadCard(elementId, filename) {
            const cardElement = document.getElementById(elementId);
            const options = { scale: 4, useCORS: true, backgroundColor: null };
            html2canvas(cardElement, options).then(canvas => {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }
        document.getElementById('download-front-btn').addEventListener('click', () => downloadCard('card-front', 'card_front.png'));
        document.getElementById('download-back-btn').addEventListener('click', () => downloadCard('card-back', 'card_back.png'));
    </script>

</body>
</html>
