<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio · Abyss / Gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Work+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--abyss:#02060a;--ink:#e9f4fb;--dim:rgba(233,244,251,.55);--cyan:#7fe3ff;--cyan-soft:rgba(127,227,255,.5);
    --gold:#e8c074;--gold-soft:rgba(232,192,116,.4);--gold-line:rgba(232,192,116,.28);--head:'Syncopate',sans-serif;--body:'Work Sans',sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;font-family:var(--body);color:var(--ink);background:radial-gradient(120% 90% at 50% -10%,#06141d 0%,#03090f 45%,#010407 100%);background-attachment:fixed}
  a{color:inherit;text-decoration:none}img{display:block}
  #c{position:fixed;inset:0;z-index:0}
  .tag,.back{position:fixed;top:16px;z-index:40;font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:var(--gold);text-transform:uppercase;background:rgba(4,12,18,.5);border:1px solid var(--gold-line);padding:7px 12px;border-radius:16px}
  .tag{left:16px}.back{right:16px;color:var(--dim)}
  /* gold viewport frame */
  .frame{position:fixed;inset:14px;z-index:30;pointer-events:none;border:1px solid var(--gold-line);border-radius:6px}
  .frame i{position:absolute;width:14px;height:14px;border:1px solid var(--gold)}
  .frame i:nth-child(1){top:-1px;left:-1px;border-right:0;border-bottom:0}.frame i:nth-child(2){top:-1px;right:-1px;border-left:0;border-bottom:0}
  .frame i:nth-child(3){bottom:-1px;left:-1px;border-right:0;border-top:0}.frame i:nth-child(4){bottom:-1px;right:-1px;border-left:0;border-top:0}
  .wrap{position:relative;z-index:5;max-width:1080px;margin:0 auto;padding:64px 6vw 80px}
  .eyebrow{font-family:var(--head);font-size:.56rem;letter-spacing:5px;color:var(--gold);text-transform:uppercase;display:inline-flex;align-items:center;gap:10px}
  .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
  .hero{padding:9vh 0 7vh}
  .hero .name{font-family:var(--head);font-weight:700;font-size:clamp(2.4rem,6vw,3.9rem);line-height:1.08;letter-spacing:-1px;margin:18px 0;
    color:#f3fbff;text-shadow:0 0 50px rgba(127,227,255,.3)}
  .hero .name b{color:var(--gold);font-weight:700;-webkit-text-stroke:0}
  .epigraph{font-style:italic;font-size:1.22rem;color:#cfecff;max-width:540px;line-height:1.5;margin-bottom:24px;padding-left:18px;border-left:1px solid var(--gold-line)}
  .actions{display:flex;gap:12px;flex-wrap:wrap}
  .btn{font-family:var(--head);font-size:.5rem;letter-spacing:2px;text-transform:uppercase;color:var(--ink);background:rgba(232,192,116,.04);
    border:1px solid var(--gold-line);padding:11px 17px;border-radius:3px;transition:.35s;cursor:pointer}
  .btn:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 0 18px var(--gold-soft)}
  .shead{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:6vh 0 26px;border-bottom:1px solid var(--gold-line);padding-bottom:13px}
  .shead h2{font-family:var(--head);font-size:1.35rem;font-weight:700;text-transform:uppercase;letter-spacing:-.5px}
  .shead h2 span{color:var(--gold)}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-family:var(--head);font-size:.48rem;letter-spacing:2px;text-transform:uppercase;background:none;border:1px solid var(--gold-line);color:var(--dim);padding:8px 14px;border-radius:3px;transition:.3s;cursor:pointer}
  .chip:hover{color:var(--ink);border-color:var(--gold-soft)} .chip.on{color:var(--abyss);background:var(--gold);border-color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:18px}
  .card{--rc:var(--cyan);position:relative;border:1px solid var(--gold-line);border-radius:5px;overflow:hidden;text-align:left;
    background:linear-gradient(165deg,rgba(8,22,32,.6),rgba(2,8,13,.75));transition:.45s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;cursor:pointer}
  .card::after{content:"";position:absolute;inset:0;border-radius:5px;pointer-events:none;box-shadow:inset 0 0 0 1px transparent;transition:.4s}
  .card:hover{transform:translateY(-5px);border-color:var(--gold)}
  .card:hover::after{box-shadow:inset 0 0 40px color-mix(in srgb,var(--rc) 22%,transparent)}
  .card .thumb{height:140px;overflow:hidden;position:relative}
  .card .thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.7) brightness(.62) contrast(1.05);transition:.6s}
  .card:hover .thumb img{filter:saturate(1) brightness(.95);transform:scale(1.05)}
  .card .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(2,8,13,.85),transparent 60%)}
  .card .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
  .card .m{font-family:var(--head);font-size:.46rem;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
  .card .t{font-weight:600;font-size:1rem;line-height:1.25}
  .card .r{font-size:.8rem;color:var(--rc)}
  .card.dim{opacity:.16;filter:saturate(.3)}
  .traits-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .trait{--rc:var(--cyan);border:1px solid var(--gold-line);border-top:2px solid var(--rc);border-radius:4px;padding:18px 20px;background:rgba(8,22,32,.4)}
  .trait .tn{font-weight:600;font-size:.95rem;color:var(--rc);margin-bottom:5px}.trait .tc{font-family:var(--head);font-size:.46rem;letter-spacing:2px;color:var(--gold)}
  .tl{display:flex;gap:30px;padding:16px 0;border-bottom:1px solid var(--gold-line)}
  .tl .w{width:150px;flex-shrink:0;font-family:var(--head);font-size:.52rem;letter-spacing:2px;color:var(--gold)}
  .tl .h{font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:.95rem;margin-bottom:5px}.tl .d{font-size:.9rem;color:var(--dim);line-height:1.6}
  .detail{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.4s}
  .detail.open{opacity:1;pointer-events:auto}.detail .s{position:absolute;inset:0;background:rgba(1,5,9,.7);backdrop-filter:blur(8px)}
  .detail .p{--rc:var(--cyan);position:relative;width:min(620px,92vw);max-height:88vh;overflow:auto;border-radius:6px;padding:34px 38px;
    background:linear-gradient(165deg,rgba(8,22,32,.95),rgba(2,8,13,.97));border:1px solid var(--gold);box-shadow:0 0 70px rgba(0,0,0,.6),inset 0 0 50px color-mix(in srgb,var(--rc) 8%,transparent)}
  .detail .m{font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:12px}
  .detail h2{font-family:var(--head);font-size:1.55rem;text-transform:uppercase;letter-spacing:-.5px;margin-bottom:16px;text-shadow:0 0 30px color-mix(in srgb,var(--rc) 40%,transparent)}
  .detail .by{font-size:1.05rem;line-height:1.7;margin-bottom:14px}.detail .st{color:var(--dim);line-height:1.7}
  .detail .x{position:absolute;top:14px;right:18px;cursor:pointer;font-family:var(--head);font-size:.5rem;letter-spacing:2px;color:var(--gold)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="frame"><i></i><i></i><i></i><i></i></div>
<div class="tag">⬡ Bio · Abyss / Gold</div><a class="back" href="./styles.html">↑ Style chooser</a>
<div class="wrap">
  <section class="hero">
    <div class="eyebrow">Game &amp; Technical Designer</div>
    <h1 class="name">Giuseppe <b>Alfieri</b></h1>
    <p class="epigraph">"I design games where the systems tell the story. The world doesn't exist until you scan it into memory."</p>
    <div class="actions"><button class="btn">Copy Email</button><a class="btn" href="#">GitHub</a><a class="btn" href="#">View CV</a></div>
  </section>
  <section><div class="shead"><h2>The <span>Work</span></h2><div class="filters" id="filters"></div></div><div class="grid" id="grid"></div></section>
  <section><div class="shead"><h2><span>Disciplines</span></h2></div><div class="traits-row" id="traits"></div></section>
  <section><div class="shead"><h2><span>Lineage</span></h2></div><div id="lineage"></div></section>
</div>
<div class="detail" id="detail"></div>
<script src="./mock-data.js"></script>
<script>
  const RCC={'Game Designer':'#7fe3ff','Technical Game Designer':'#ffd27a','Leadership':'#e6a8ff','Game Programmer':'#7dffd0'};
  const rcc=r=>RCC[r]||'#7fe3ff';
  document.getElementById('grid').innerHTML=DATA.map(p=>`<button class="card" data-id="${p.id}" data-cat="${p.cat}" style="--rc:${rcc(p.role)}"><div class="thumb"><img src="${p.img}" alt=""></div><div class="b"><div class="m">${p.cat} · ${p.year}</div><div class="t">${p.title}</div><div class="r">${p.role}</div></div></button>`).join('');
  document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>openD(c.dataset.id)));
  const filters=['ALL',...CATS];
  document.getElementById('filters').innerHTML=filters.map((f,i)=>`<button class="chip ${i?'':'on'}" data-cat="${f}">${f==='PROFESSIONAL'?'PRO':f==='UNIVERSITY'?'UNI':f}</button>`).join('');
  document.querySelectorAll('#filters .chip').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#filters .chip').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.card').forEach(c=>c.classList.toggle('dim',b.dataset.cat!=='ALL'&&c.dataset.cat!==b.dataset.cat));}));
  const tc=traitCounts();
  document.getElementById('traits').innerHTML=Object.keys(RCC).map(r=>`<div class="trait" style="--rc:${rcc(r)}"><div class="tn">${r}</div><div class="tc">${String(tc[r]).padStart(2,'0')} SPECIMENS</div></div>`).join('');
  document.getElementById('lineage').innerHTML=LINEAGE.map(l=>`<div class="tl"><div class="w">[ ${l.when} ]</div><div><div class="h">${l.what}</div><div class="d">${l.where}</div></div></div>`).join('');
  function openD(id){const p=DATA.find(x=>x.id===id);const d=document.getElementById('detail');d.innerHTML=`<div class="s"></div><div class="p" style="--rc:${rcc(p.role)}"><span class="x">RELEASE ✕</span><div class="m">◎ ${p.cat} · ${p.year} · ${p.role}</div><h2>${p.title}</h2><p class="by">${p.blurb}</p><p class="st">${p.story}</p></div>`;requestAnimationFrame(()=>d.classList.add('open'));d.addEventListener('click',e=>{if(e.target===d||e.target.classList.contains('s')||e.target.classList.contains('x'))d.classList.remove('open');});}
  // canvas: translucent jelly (SSS) + plankton + a thin GOLD god-shaft. emissive bloom only.
  const cv=document.getElementById('c'),g=cv.getContext('2d');let W,H,t=0,pk=[];
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;pk=[];for(let i=0;i<70;i++)pk.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.6,vy:-.04-Math.random()*.1,ph:Math.random()*6.28});}
  addEventListener('resize',rs);rs();
  const R=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
  function biolight(x,y,r,c,k){let gr=g.createRadialGradient(x,y,0,x,y,r*2.6);gr.addColorStop(0,R(c,.14*k));gr.addColorStop(1,R(c,0));g.fillStyle=gr;g.beginPath();g.arc(x,y,r*2.6,0,6.28);g.fill();gr=g.createRadialGradient(x,y,0,x,y,r*.6);gr.addColorStop(0,`rgba(240,250,255,${.85*k})`);gr.addColorStop(.45,R(c,.6*k));gr.addColorStop(1,R(c,0));g.fillStyle=gr;g.beginPath();g.arc(x,y,r*.6,0,6.28);g.fill();}
  function frame(){if(W!==innerWidth||H!==innerHeight)rs();t++;g.clearRect(0,0,W,H);g.globalCompositeOperation='lighter';
    // faint gold god-shaft (rare warm light from above)
    const sx=W*.7+Math.sin(t*.003)*40;const sg=g.createLinearGradient(sx,0,sx-120,H);sg.addColorStop(0,'rgba(232,192,116,.05)');sg.addColorStop(1,'rgba(232,192,116,0)');g.fillStyle=sg;g.beginPath();g.moveTo(sx-30,0);g.lineTo(sx+50,0);g.lineTo(sx-120,H);g.lineTo(sx-200,H);g.closePath();g.fill();
    for(const p of pk){p.y+=p.vy;if(p.y<-6){p.y=H+6;p.x=Math.random()*W;}const tw=.4+.6*Math.sin(t*.03+p.ph);biolight(p.x,p.y,p.r*2.2,[127,227,255],.5*tw);}
    // a translucent jelly drifting bottom-left
    const jx=W*.2+Math.sin(t*.005)*40,jy=H*.72+Math.cos(t*.007)*26,s=70,k=.5+.1*Math.sin(t*.02);
    for(let i=0;i<8;i++){const off=(i/7-.5)*s*1.3;g.beginPath();g.moveTo(jx+off*.6,jy);for(let q=1;q<=6;q++){g.lineTo(jx+off+Math.sin(t*.04+q+i)*s*.16,jy+q*s*.32);}const tg=g.createLinearGradient(jx,jy,jx,jy+s*2);tg.addColorStop(0,R([127,227,255],.3*k));tg.addColorStop(1,R([127,227,255],0));g.strokeStyle=tg;g.lineWidth=1.2;g.stroke();}
    const dg=g.createRadialGradient(jx,jy-s*.1,0,jx,jy-s*.1,s);dg.addColorStop(0,`rgba(240,250,255,${.22*k})`);dg.addColorStop(.55,R([127,227,255],.18*k));dg.addColorStop(1,R([127,227,255],0));g.fillStyle=dg;g.beginPath();g.ellipse(jx,jy-s*.1,s,s*.8,0,Math.PI,2*Math.PI);g.fill();g.strokeStyle=R([232,192,116],.3*k);g.lineWidth=1.4;g.beginPath();g.ellipse(jx,jy-s*.1,s,s*.8,0,Math.PI,2*Math.PI);g.stroke();biolight(jx,jy-s*.18,s*.3,[127,227,255],k*.8);
    g.globalCompositeOperation='source-over';document.hidden?setTimeout(frame,200):requestAnimationFrame(frame);}
  frame();
</script>
</body>
</html>
