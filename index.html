<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project VarXel · Giuseppe Luigi Alfieri</title>
<meta name="description" content="Everything Giuseppe Luigi Alfieri has made or explored: games, mods, prototypes, stories, tools.">
<!-- GENERATED DATA: assets/js/varxel.js (public entries) from the vault, by tools/build-content.mjs.
     On localhost the page also loads assets/js/varxel.private.js (every entry; git-ignored, never published). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--void:#08090a;--panel:#0e1012;--panel2:#13161a;--ink:#e7e6e1;--dim:rgba(231,230,225,.6);--faint:rgba(231,230,225,.12);--ice:#9fd8ff;--amber:#f0a640;
  --k-game:#9fd8ff;--k-prototype:#6fb3dc;--k-mod:#f0a640;--k-tabletop:#c39bff;--k-story:#ff8fa3;--k-work:#8aa0b4;--k-tool:#7fdca0;--k-course:#9a9a9a;--k-idea:#d8d5c8;
  --serif:'Cormorant Garamond',serif;--mono:'IBM Plex Mono',monospace;--sans:Inter,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--void);height:100%}
body{color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{border-right:1px solid var(--faint);padding:22px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.brand b{color:var(--ice);font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{text-align:left;padding:9px 10px;font-size:.92rem;color:var(--dim);border-left:2px solid transparent}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="true"]{color:var(--ink);border-left-color:var(--ice);background:var(--panel)}
.layer{border:1px solid var(--faint);padding:12px;display:flex;flex-direction:column;gap:8px}
.switch{display:flex;align-items:center;gap:10px;font-size:.88rem}
.switch i{width:30px;height:16px;border-radius:9px;background:var(--faint);position:relative;flex:none;transition:.2s}
.switch i::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--dim);transition:.2s}
.switch[aria-pressed="true"] i{background:rgba(159,216,255,.35)}.switch[aria-pressed="true"] i::after{left:16px;background:var(--ice)}
.links{display:flex;flex-direction:column;gap:6px}.links a{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-decoration:none}.links a:hover{color:var(--ice)}
.private{margin-bottom:18px;padding:10px 14px;border:1px solid rgba(240,166,64,.4);color:var(--amber);font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.empty{border:1px dashed var(--faint);padding:28px;color:var(--dim);line-height:1.7;margin-top:20px}.empty a{color:var(--ice)}
.play{display:inline-block;margin-top:14px;padding:11px 16px;background:var(--ice);color:var(--void);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:auto}
.legend span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:5px}
.legend b{width:8px;height:8px;border-radius:2px;display:inline-block}
main{padding:26px 34px 80px;min-width:0}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:26px}
.search{flex:1;min-width:220px;border:1px solid var(--faint);background:var(--panel);padding:11px 14px;font-size:.95rem}
.search:focus{outline:none;border-color:var(--ice)}
h1{font-family:var(--serif);font-weight:300;font-size:2.6rem;line-height:1;margin:6px 0 4px}
h2{font-family:var(--serif);font-weight:300;font-size:1.7rem;margin:34px 0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:20px}
.stat{background:var(--panel);border:1px solid var(--faint);padding:14px}
.stat b{display:block;font-family:var(--serif);font-weight:300;font-size:2rem;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;background:var(--panel);border:1px solid var(--faint);font-size:.9rem;text-align:left;transition:.15s}
.chip:hover{border-color:var(--ice)}
.chip .dot{width:8px;height:8px;border-radius:2px;flex:none}
.chip small{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.chip.dim{opacity:.22}
.st{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--faint);color:var(--dim)}
.st.building,.st.exploring,.st.active{color:var(--ice);border-color:rgba(159,216,255,.4)}
.st.finished{color:#7fdca0;border-color:rgba(127,220,160,.35)}
.st.superseded{color:var(--amber);border-color:rgba(240,166,64,.35)}
.st.parked{color:#c39bff;border-color:rgba(195,155,255,.35)}
.year{display:grid;grid-template-columns:90px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--faint)}
.year .y{font-family:var(--serif);font-size:1.8rem;font-weight:300;color:var(--dim)}
.fam{border:1px solid var(--faint);background:var(--panel);padding:16px 18px;margin-bottom:12px}
.fam h3{font-family:var(--serif);font-weight:300;font-size:1.4rem;margin-bottom:12px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.arrow{color:var(--dim);font-family:var(--mono)}
.board{display:grid;grid-template-columns:repeat(8,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:10px}
.lane{background:var(--panel);border:1px solid var(--faint);padding:10px;min-height:120px}
.lane .chips{flex-direction:column}
.lane .chip{width:100%}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.drawer{position:fixed;top:0;right:0;width:min(520px,100%);height:100vh;background:var(--panel2);border-left:1px solid var(--faint);transform:translateX(100%);transition:.25s;overflow-y:auto;z-index:20;padding:26px 28px 60px}
.drawer.open{transform:none}
.drawer .x{position:absolute;top:18px;right:20px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.drawer h2{margin:10px 0 10px;font-size:2.2rem}
.drawer .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.drawer p{line-height:1.7;color:rgba(231,230,225,.86);margin:10px 0}
.drawer blockquote{border-left:2px solid var(--amber);padding:4px 0 4px 14px;font-family:var(--serif);font-style:italic;font-size:1.12rem;line-height:1.5;color:rgba(231,230,225,.86);margin:14px 0}
.drawer ul{margin:8px 0 0 18px;line-height:1.7;color:rgba(231,230,225,.86)}
.drawer .sec{margin-top:20px}
.note{margin-top:28px;padding:14px 16px;border:1px dashed var(--faint);color:var(--dim);font-size:.88rem;line-height:1.6}
@media (max-width:860px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--faint)}
  .nav{flex-direction:row;flex-wrap:wrap}.legend{display:none}main{padding:20px 16px 60px}.year{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div><div class="brand">Project <b>VarXel</b></div><div class="mono" style="margin-top:6px;text-transform:none;letter-spacing:.02em">Giuseppe Luigi Alfieri</div></div>
    <nav class="nav" id="nav"></nav>
    <div class="links"><a href="./portfolio.html">Portfolio →</a><a href="./lab.html">The Lab →</a><a href="https://github.com/VarXael" target="_blank" rel="noopener">GitHub →</a></div>
    <div class="layer">
      <span class="mono">Layers</span>
      <button class="switch" id="pf" aria-pressed="false"><i></i>Portfolio</button>
      <span class="mono" id="pf-count" style="text-transform:none;letter-spacing:0"></span>
    </div>
    <div class="legend" id="legend"></div>
  </aside>
  <main>
    <div class="bar"><input class="search" id="q" placeholder="Search everything: a title, a kind, a word from a note"></div>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<aside class="drawer" id="drawer"><button class="x" id="x">Close ✕</button><div id="d"></div></aside>
<script src="./assets/js/varxel.js"></script>
<script>
/* on this computer, show every entry (the private file is git-ignored, so it never exists online) */
const LOCAL = ["localhost", "127.0.0.1", ""].includes(location.hostname);
function boot() {
const D = window.VARXEL || [];
const byTitle = Object.fromEntries(D.map(e => [e.title, e]));
const KINDS = ['game', 'prototype', 'mod', 'tabletop', 'story', 'work', 'tool', 'course', 'idea'];
const STATUSES = ['idea', 'exploring', 'building', 'active', 'finished', 'parked', 'superseded', ''];
const SL = s => s || 'unset';
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const kc = k => `var(--k-${KINDS.includes(k) ? k : 'idea'})`;
let view = 'overview', q = '', portfolio = false;

const VIEWS = { overview: 'Overview', timeline: 'Timeline', families: 'Families', kinds: 'Kinds', board: 'Status board' };
document.getElementById('nav').innerHTML = Object.entries(VIEWS).map(([k, v]) => `<button data-v="${k}">${v}</button>`).join('');
document.getElementById('legend').innerHTML = KINDS.map(k => `<span><b style="background:${kc(k)}"></b>${k}</span>`).join('');
document.getElementById('pf-count').textContent = `${D.filter(e => e.portfolio).length} entries are in the portfolio`;
const priv = D.filter(e => !e.public).length;
document.getElementById('banner').innerHTML = priv ? `<div class="private">Private view: ${priv} of ${D.length} entries are private and visible only on this computer.</div>` : '';

const match = e => !q || [e.title, e.kind, e.family, e.desc, e.quote, ...(e.timeline || [])].join(' ').toLowerCase().includes(q);
const chip = (e, sub = '') => `<button class="chip ${portfolio && !e.portfolio ? 'dim' : ''}" data-t="${esc(e.title)}">
  <span class="dot" style="background:${kc(e.kind)}"></span>${esc(e.title)}${sub ? ` <small>${esc(sub)}</small>` : ''}</button>`;
const list = () => D.filter(match);

function overview() {
  const L = list(), cnt = s => L.filter(e => SL(e.status) === s).length;
  const moving = L.filter(e => ['building', 'exploring', 'active'].includes(e.status));
  const fams = families(L).filter(f => f.items.length > 2).slice(0, 4);
  if (!D.length) return `<span class="mono">Everything I have made or explored</span><h1>Being catalogued</h1><div class="empty">Every game, mod, prototype, story and tool I have made or explored is being written up here, one entry at a time. Meanwhile, the selected work is in the <a href="./portfolio.html">portfolio</a> and the playable pieces are in <a href="./lab.html">the Lab</a>.</div>`;
  return `<span class="mono">Everything I have made or explored</span><h1>${L.length} entries</h1>
  <div class="stats">${['building', 'exploring', 'finished', 'superseded', 'parked', 'idea', 'unset'].map(s => `<div class="stat"><b>${cnt(s)}</b><span class="mono">${s}</span></div>`).join('')}</div>
  <h2>In motion</h2><div class="chips">${moving.map(e => chip(e, e.status)).join('') || '<span class="mono">nothing</span>'}</div>
  <h2>Families</h2>${fams.map(famBlock).join('')}
  <h2>By kind</h2><div class="chips">${KINDS.map(k => { const n = L.filter(e => e.kind === k).length; return n ? `<span class="chip"><span class="dot" style="background:${kc(k)}"></span>${k} <small>${n}</small></span>` : ''; }).join('')}</div>`;
}

function timeline() {
  const L = list(), years = [...new Set(L.map(e => String(e.started || '')))].sort((a, b) => (b || '0').localeCompare(a || '0'));
  return `<span class="mono">When each thing started</span><h1>Timeline</h1>` + years.map(y => `<div class="year"><div class="y">${y || 'undated'}</div>
    <div class="chips">${L.filter(e => String(e.started || '') === y).map(e => chip(e, e.status ? e.status : '')).join('')}</div></div>`).join('');
}

/* a family = entries sharing `family`, ordered so that what something came from is shown before it */
function families(L) {
  const groups = {};
  L.forEach(e => { if (e.family) (groups[e.family] ||= []).push(e); });
  return Object.entries(groups).map(([name, items]) => {
    const order = [], seen = new Set();
    const visit = e => { if (seen.has(e.title)) return; seen.add(e.title); (e.from || []).forEach(t => byTitle[t] && items.includes(byTitle[t]) && visit(byTitle[t])); order.push(e); };
    items.forEach(visit);
    return { name, items: order };
  }).sort((a, b) => b.items.length - a.items.length);
}
const famBlock = f => `<div class="fam"><h3>${esc(f.name)}</h3><div class="flow">${f.items.map((e, i) => {
  const prev = f.items[i - 1], linked = prev && (e.from || []).includes(prev.title);
  return (i ? `<span class="arrow">${linked ? '→' : '·'}</span>` : '') + chip(e, e.status);
}).join('')}</div></div>`;
const familiesView = () => `<span class="mono">What grew out of what (→ means "became")</span><h1>Families</h1>` + families(list()).map(famBlock).join('');

function kinds() {
  const L = list();
  return `<span class="mono">Grouped by what they are</span><h1>Kinds</h1><div class="kinds">` + KINDS.map(k => {
    const items = L.filter(e => e.kind === k); if (!items.length) return '';
    return `<div class="fam"><h3><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${kc(k)};margin-right:8px"></span>${k} <span class="mono">${items.length}</span></h3><div class="chips">${items.map(e => chip(e)).join('')}</div></div>`;
  }).join('') + '</div>';
}

function board() {
  const L = list();
  return `<span class="mono">Every entry by where it stands</span><h1>Status board</h1><div class="board">` + STATUSES.map(s =>
    `<div class="lane"><div class="mono" style="margin-bottom:10px">${SL(s)} · ${L.filter(e => (e.status || '') === s).length}</div><div class="chips">${L.filter(e => (e.status || '') === s).map(e => chip(e)).join('')}</div></div>`).join('') + '</div>';
}

function open(t) {
  const e = byTitle[t]; if (!e) return;
  const links = arr => arr.map(x => byTitle[x] ? chip(byTitle[x]) : `<span class="chip">${esc(x)}</span>`).join('');
  document.getElementById('d').innerHTML = `<span class="mono">${esc([e.kind, e.family, e.started].filter(Boolean).join(' · '))}</span>
    <h2>${esc(e.title)}</h2>
    <div class="meta"><span class="st ${esc(e.status)}">${SL(e.status)}</span>${e.portfolio ? '<a class="st" href="./portfolio.html" style="text-decoration:none">in the portfolio</a>' : ''}${!e.public ? '<span class="st" style="color:var(--amber)">private</span>' : ''}${e.repo ? `<span class="mono" style="text-transform:none;letter-spacing:0">${esc(e.repo)}</span>` : ''}</div>
    ${e.desc ? e.desc.split('\n\n').map(p => `<p>${esc(p)}</p>`).join('') : ''}
    ${e.quote ? `<blockquote>${esc(e.quote)}</blockquote>` : ''}
    ${e.from.length ? `<div class="sec"><span class="mono">Grew out of</span><div class="chips" style="margin-top:8px">${links(e.from)}</div></div>` : ''}
    ${e.became.length ? `<div class="sec"><span class="mono">Became</span><div class="chips" style="margin-top:8px">${links(e.became)}</div></div>` : ''}
    ${e.timeline.length ? `<div class="sec"><span class="mono">Timeline</span><ul>${e.timeline.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${e.play ? `<a class="play" href="${e.play}">Play →</a>` : ''}
    <div class="sec"><span class="mono">${e.sources} source note${e.sources === 1 ? '' : 's'} in the notes</span></div>`;
  history.replaceState(null, '', '#' + encodeURIComponent(e.title));
  document.getElementById('drawer').classList.add('open');
}

function render() {
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.v === view));
  document.getElementById('view').innerHTML = { overview, timeline, families: familiesView, kinds, board }[view]();
}
document.getElementById('nav').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) { view = b.dataset.v; render(); } });
document.getElementById('q').addEventListener('input', ev => { q = ev.target.value.trim().toLowerCase(); render(); });
document.getElementById('pf').addEventListener('click', ev => { portfolio = !portfolio; ev.currentTarget.setAttribute('aria-pressed', portfolio); render(); });
document.addEventListener('click', ev => { const c = ev.target.closest('.chip[data-t]'); if (c) open(c.dataset.t); });
const close = () => { document.getElementById('drawer').classList.remove('open'); history.replaceState(null, '', location.pathname); };
document.getElementById('x').addEventListener('click', close);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') close(); });
render();
if (location.hash) open(decodeURIComponent(location.hash.slice(1)));
}
if (LOCAL) { const s = document.createElement('script'); s.src = './assets/js/varxel.private.js'; s.onload = boot; s.onerror = boot; document.head.appendChild(s); }
else boot();
</script>
</body>
</html>
