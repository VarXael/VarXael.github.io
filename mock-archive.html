<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOCK 3 · The Specimen Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Work+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./mock-shared.css">
<style>
  html,body{height:100%;overflow:hidden}
  .shell{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;padding:54px 6vw 0;max-width:1280px;margin:0 auto}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--lum-faint)}
  .topbar .name{font-size:1.7rem}
  .topbar .who{font-size:.9rem;color:var(--dim);max-width:440px;line-height:1.6;margin-top:6px}
  .topbar .actions{display:flex;gap:10px;flex-wrap:wrap}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 0}
  .toolbar .filters{display:flex;gap:8px;flex-wrap:wrap}
  .toolbar .right{display:flex;gap:12px;align-items:center}
  .count{font-family:var(--head);font-size:.5rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
  select{background:rgba(180,230,255,.04);border:1px solid var(--lum-faint);color:var(--ink);font-family:var(--head);font-size:.5rem;letter-spacing:1px;padding:9px 12px;border-radius:14px;text-transform:uppercase;cursor:pointer}
  .toggle{display:flex;border:1px solid var(--lum-faint);border-radius:14px;overflow:hidden}
  .toggle button{background:none;border:none;color:var(--dim);font-family:var(--head);font-size:.5rem;letter-spacing:1px;padding:9px 12px;text-transform:uppercase}
  .toggle button.on{background:var(--lum);color:var(--abyss)}
  .catalog{flex:1;overflow-y:auto;padding:6px 0 40px}
  /* LIST (default) */
  .rows{display:flex;flex-direction:column}
  .row{--rc:var(--lum);display:grid;grid-template-columns:34px 2.4fr 1fr 1.1fr 70px;gap:18px;align-items:center;
    text-align:left;background:none;border:none;border-bottom:1px solid var(--lum-faint);padding:15px 10px;transition:.3s;color:inherit}
  .row:hover{background:rgba(180,230,255,.05)}
  .row .rid{font-family:var(--head);font-size:.5rem;color:var(--rc);opacity:.7}
  .row .rname{font-weight:600;font-size:1.02rem}
  .row .rrole{font-size:.84rem;color:var(--dim)}
  .row .rcat{font-family:var(--head);font-size:.5rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
  .row .ryear{font-family:var(--head);font-size:.56rem;color:var(--rc);text-align:right}
  .row .dot{width:8px;height:8px;border-radius:50%;background:var(--rc);box-shadow:0 0 8px var(--rc)}
  .row.dim{opacity:.2}
  /* GRID */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .hidden{display:none}
  @media(max-width:880px){ html,body{overflow:auto} .shell{position:static;height:auto} .row{grid-template-columns:24px 2fr 60px;gap:10px} .row .rrole,.row .rcat{display:none} }
</style>
</head>
<body>
<canvas id="sea"></canvas><div class="depth-fog" id="fog" style="opacity:.34"></div><div class="vignette"></div>
<div class="mock-tag">03 · The Specimen Archive</div><a class="mock-back" href="./mock.html">↑ All mockups</a>

<div class="shell">
  <div class="topbar">
    <div>
      <div class="eyebrow">Specimen Index</div>
      <h1 class="name">Giuseppe Alfieri</h1>
      <p class="who">Game &amp; technical designer. I design systems where everything connects, and everything I design, I can build. Browse the catalog below.</p>
    </div>
    <div class="actions"><button class="btn">Copy Email</button><a class="btn" href="#">GitHub</a><a class="btn" href="#">CV</a><a class="btn" href="#">Lineage</a></div>
  </div>

  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <div class="right">
      <span class="count" id="count"></span>
      <select id="sort"><option value="tier">Sort: Featured</option><option value="year">Sort: Newest</option><option value="title">Sort: A–Z</option></select>
      <div class="toggle"><button class="on" data-v="list">List</button><button data-v="grid">Grid</button></div>
    </div>
  </div>

  <div class="catalog">
    <div class="rows" id="rows"></div>
    <div class="grid hidden" id="grid"></div>
  </div>
</div>

<script src="./mock-data.js"></script>
<script>
  mockSea();
  let activeFilter='ALL', sortKey='tier', view='list', items=[...DATA];
  const order={ 'PERSONAL':0,'PROFESSIONAL':1,'UNIVERSITY':2,'JAM':3 };
  function sortItems(){
    items=[...DATA].sort((a,b)=>{
      if(sortKey==='year') return b.year-a.year;
      if(sortKey==='title') return a.title.localeCompare(b.title);
      return (order[a.cat]-order[b.cat])|| (b.year-a.year);
    });
  }
  function rowHTML(p,i){ const rc=roleColor(p.role); return `<button class="row" data-id="${p.id}" data-cat="${p.cat}" style="--rc:${rc}">
    <span class="dot"></span>
    <span><div class="rname">${p.title}</div><div class="rrole">${p.role}</div></span>
    <span class="rcat">${p.cat}</span>
    <span class="rrole">${p.blurb.slice(0,46)}…</span>
    <span class="ryear">${p.year}</span></button>`; }
  function render(){
    sortItems();
    document.getElementById('rows').innerHTML=items.map(rowHTML).join('');
    document.getElementById('grid').innerHTML=items.map(cardHTML).join('');
    applyFilter();
    document.querySelectorAll('.row[data-id]').forEach(r=>r.addEventListener('click',()=>openDetail(r.dataset.id)));
    wireCards();
    document.getElementById('rows').classList.toggle('hidden',view!=='list');
    document.getElementById('grid').classList.toggle('hidden',view!=='grid');
  }
  function applyFilter(){
    let shown=0;
    document.querySelectorAll('.row[data-id],.card[data-id]').forEach(el=>{
      const ok=activeFilter==='ALL'||el.dataset.cat===activeFilter; el.classList.toggle('dim',!ok); if(ok)shown++;
    });
    document.getElementById('count').textContent=(activeFilter==='ALL'?DATA.length:shown/2)+' SPECIMENS';
  }
  const filters=['ALL',...CATS];
  document.getElementById('filters').innerHTML=filters.map((f,i)=>`<button class="chip ${i===0?'on':''}" data-cat="${f}">${f==='PROFESSIONAL'?'PRO':f==='UNIVERSITY'?'UNI':f}</button>`).join('');
  document.querySelectorAll('#filters .chip').forEach(b=>b.addEventListener('click',()=>{ activeFilter=b.dataset.cat; document.querySelectorAll('#filters .chip').forEach(x=>x.classList.toggle('on',x===b)); applyFilter(); }));
  document.getElementById('sort').addEventListener('change',e=>{ sortKey=e.target.value; render(); });
  document.querySelectorAll('.toggle button').forEach(b=>b.addEventListener('click',()=>{ view=b.dataset.v; document.querySelectorAll('.toggle button').forEach(x=>x.classList.toggle('on',x===b)); render(); }));
  render();
</script>
</body>
</html>
