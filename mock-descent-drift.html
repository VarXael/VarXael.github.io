<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOCK · Descent C · The Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Work+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./mock-shared.css">
<style>
  body{overflow-x:hidden}
  .snow{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
  .flake{position:absolute;border-radius:50%;background:rgba(180,230,255,.7);bottom:-10px;animation:rise linear infinite}
  @keyframes rise{from{transform:translateY(0)}to{transform:translateY(-112vh)}}
  .hud{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;padding:18px 30px;pointer-events:none}
  .hud .brand{font-family:var(--head);font-size:.62rem;letter-spacing:4px;font-weight:700}
  .tele{font-family:var(--head);font-size:8px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
  .tele b{color:var(--lum);text-shadow:0 0 8px rgba(180,230,255,.5)}
  .wrap{position:relative;z-index:5}
  section{position:relative;min-height:108vh;display:flex;flex-direction:column;justify-content:center;padding:14vh 9vw;max-width:1180px;margin:0 auto;overflow:visible}
  .water-no{position:absolute;right:4vw;top:50%;transform:translateY(-50%);font-family:var(--head);font-weight:700;font-size:clamp(6rem,20vw,16rem);
    color:rgba(180,230,255,.035);z-index:-1;letter-spacing:-6px;pointer-events:none;will-change:transform}
  .hero .name{font-size:3.2rem;margin:16px 0}.hero .epigraph{font-size:1.25rem;max-width:560px;margin-bottom:26px}
  .hero .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
  .seyebrow{font-family:var(--head);font-size:.6rem;letter-spacing:4px;color:var(--lum);text-transform:uppercase;margin-bottom:24px;display:inline-block;text-shadow:0 0 12px rgba(180,230,255,.4)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
  .grid .card{opacity:0;transition:opacity .8s var(--ease),transform .8s var(--ease)}
  .grid .card:nth-child(odd){transform:translateX(-50px)}.grid .card:nth-child(even){transform:translateX(50px)}
  section.lit .grid .card{opacity:1;transform:none}
  section.lit .grid .card:nth-child(2){transition-delay:.1s}section.lit .grid .card:nth-child(3){transition-delay:.18s}
  section.lit .grid .card:nth-child(4){transition-delay:.26s}section.lit .grid .card:nth-child(5){transition-delay:.34s}section.lit .grid .card:nth-child(6){transition-delay:.42s}
  .fade{opacity:0;transform:translateY(30px);transition:.9s var(--ease)}section.lit .fade{opacity:1;transform:none}
  .traits-row{margin-top:4px}
  .cue{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:25;font-family:var(--head);font-size:.52rem;letter-spacing:4px;color:var(--lum);text-transform:uppercase;animation:sink 2.4s ease-in-out infinite}
  @keyframes sink{0%,100%{transform:translate(-50%,0);opacity:.5}50%{transform:translate(-50%,8px);opacity:1}}
  body.moved .cue{opacity:0;transition:.5s}
</style>
</head>
<body>
<canvas id="sea"></canvas><div class="depth-fog" id="fog"></div><div class="snow" id="snow"></div><div class="vignette"></div>
<div class="mock-tag">C · The Drift</div><a class="mock-back" href="./mock.html">↑ All mockups</a>
<header class="hud"><div class="brand">G.ALFIERI <small style="color:var(--lum)">//</small> SPECIMEN</div>
  <span class="tele">DEPTH <b id="depth">0M</b></span></header>
<div class="cue" id="cue">Sink ↓</div>

<div class="wrap" id="wrap"></div>

<script src="./mock-data.js"></script>
<script>
  mockSea();
  // marine snow
  const snow=document.getElementById('snow'); let sh='';
  for(let i=0;i<34;i++){ const s=1+Math.random()*2.5, x=Math.random()*100, dur=9+Math.random()*16, del=-Math.random()*24, op=.15+Math.random()*.5;
    sh+=`<div class="flake" style="left:${x}vw;width:${s}px;height:${s}px;opacity:${op.toFixed(2)};animation-duration:${dur.toFixed(1)}s;animation-delay:${del.toFixed(1)}s"></div>`; }
  snow.innerHTML=sh;

  const tc=traitCounts();
  const proPers=DATA.filter(p=>p.cat==='PROFESSIONAL'||p.cat==='PERSONAL');
  const uniJam=DATA.filter(p=>p.cat==='UNIVERSITY'||p.cat==='JAM');
  const stops=[
    {no:'00',html:`<div class="hero fade"><div class="eyebrow">Game &amp; Technical Designer</div><h1 class="name">Giuseppe<br>Alfieri</h1><p class="epigraph">"The world doesn't exist until you scan it into memory."</p><p class="bio" style="max-width:600px">A systems designer who bridges design philosophy and technical execution. Everything I design, I can also build.</p><div class="actions"><button class="btn">Copy Email</button><a class="btn" href="#">GitHub</a><a class="btn" href="#">View CV</a></div></div>`},
    {no:'01',html:`<div class="seyebrow fade">The Work · Shipped &amp; Personal</div><div class="grid">${proPers.map(cardHTML).join('')}</div>`},
    {no:'02',html:`<div class="seyebrow fade">Deep Cuts · University &amp; Jams</div><div class="grid">${uniJam.map(cardHTML).join('')}</div>`},
    {no:'03',html:`<div class="seyebrow fade">Disciplines</div><div class="traits-row fade">${Object.keys(RC).map(r=>`<div class="trait" style="--rc:${RC[r]}"><div class="tname">${r}</div><div class="tn">${String(tc[r]).padStart(2,'0')} SPECIMENS</div></div>`).join('')}</div>`},
    {no:'04',html:`<div class="seyebrow fade">Lineage · Origins</div><div class="fade">${LINEAGE.map(l=>`<div class="tl-item"><div class="tl-when">[ ${l.when} ]</div><div><div class="tl-what">${l.what}</div><div class="tl-where">${l.where}</div></div></div>`).join('')}</div>`},
  ];
  document.getElementById('wrap').innerHTML=stops.map(s=>`<section><div class="water-no" data-par>${s.no}</div>${s.html}</section>`).join('');
  wireCards();

  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('lit');}),{threshold:.14});
  document.querySelectorAll('section').forEach(s=>io.observe(s));

  const depth=document.getElementById('depth'),fog=document.getElementById('fog'),nums=[...document.querySelectorAll('[data-par]')];
  function onScroll(){
    const max=document.documentElement.scrollHeight-innerHeight, f=max>0?Math.min(1,scrollY/max):0;
    depth.textContent=Math.round(f*3600)+'M'; fog.style.opacity=(0.06+f*0.55).toFixed(3);
    if(scrollY>40) document.body.classList.add('moved');
    // parallax: watermark numbers drift slower than the page
    nums.forEach(n=>{ const r=n.parentElement.getBoundingClientRect(); n.style.transform=`translateY(calc(-50% + ${(r.top*0.12).toFixed(0)}px))`; });
  }
  addEventListener('scroll',onScroll,{passive:true}); onScroll();
</script>
</body>
</html>
