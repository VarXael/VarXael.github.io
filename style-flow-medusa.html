<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flOw · Medusa (bioluminescent)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Work+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eaf6ff;--dim:rgba(234,246,255,.6);--head:'Syncopate',sans-serif;--body:'Work Sans',sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--body);color:var(--ink);cursor:none;background:linear-gradient(180deg,#0a3142 0%,#062130 26%,#03131d 56%,#01080e 100%)}
  #c{position:fixed;inset:0;z-index:1;display:block}
  .veil{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(90% 80% at 50% 30%,transparent 45%,rgba(1,6,12,.55))}
  .tag,.back{position:fixed;top:18px;z-index:40;font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:rgba(180,230,255,.85);text-transform:uppercase;background:rgba(4,18,26,.45);border:1px solid rgba(150,210,240,.18);padding:7px 12px;border-radius:18px;backdrop-filter:blur(4px)}
  .tag{left:18px}.back{right:18px;color:var(--dim)}
  .intro{position:fixed;left:8vw;top:50%;transform:translateY(-50%);z-index:10;max-width:430px;transition:opacity 1s}
  .intro.dim{opacity:.12}
  .eyebrow{font-family:var(--head);font-size:.56rem;letter-spacing:5px;color:#9fe6ff;text-transform:uppercase;margin-bottom:16px}
  .name{font-family:var(--head);font-weight:700;font-size:clamp(2.3rem,6vw,3.9rem);line-height:1.06;letter-spacing:-1px;text-shadow:0 0 60px rgba(120,210,255,.5)}
  .epigraph{font-style:italic;font-size:1.18rem;color:#bfe9ff;line-height:1.5;margin-top:20px;max-width:360px}
  .hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:10;font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:var(--dim);text-transform:uppercase;animation:b 3s ease-in-out infinite}
  @keyframes b{0%,100%{opacity:.3}50%{opacity:.8}}
  .bubble{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.5s}
  .bubble.open{opacity:1;pointer-events:auto}
  .bubble .scrim{position:absolute;inset:0;background:rgba(2,12,20,.5);backdrop-filter:blur(10px)}
  .bubble .card{position:relative;width:min(540px,90vw);padding:38px 42px;border-radius:34px;text-align:center;
    background:radial-gradient(130% 130% at 50% 0%,color-mix(in srgb,var(--rc) 18%,rgba(6,28,40,.55)),rgba(3,14,22,.85));
    border:1px solid color-mix(in srgb,var(--rc) 45%,transparent);box-shadow:0 0 100px color-mix(in srgb,var(--rc) 40%,transparent),inset 0 0 60px color-mix(in srgb,var(--rc) 10%,transparent);
    backdrop-filter:blur(3px);transform:scale(.92);transition:transform .5s cubic-bezier(.22,1,.36,1)}
  .bubble.open .card{transform:scale(1)}
  .bubble .meta{font-family:var(--head);font-size:.52rem;letter-spacing:3px;color:var(--rc);text-transform:uppercase;margin-bottom:13px}
  .bubble h2{font-family:var(--head);font-size:1.6rem;text-transform:uppercase;letter-spacing:-.5px;margin-bottom:16px;text-shadow:0 0 34px color-mix(in srgb,var(--rc) 60%,transparent)}
  .bubble p{font-size:1.02rem;line-height:1.7;color:#d6efff}
  .bubble .x{margin-top:24px;font-family:var(--head);font-size:.5rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c"></canvas><div class="veil"></div>
<div class="tag">✺ flOw · Medusa</div><a class="back" href="./styles.html">↑ Style chooser</a>
<div class="intro" id="intro"><div class="eyebrow">Game &amp; Technical Designer</div><h1 class="name">Giuseppe<br>Alfieri</h1><p class="epigraph">"The systems tell the story."</p></div>
<div class="hint">drift to a jelly to observe it</div>
<div class="bubble" id="bubble"></div>
<script src="./mock-data.js"></script>
<script>
  const cv=document.getElementById('c'),g=cv.getContext('2d');
  let W,H,t=0,mx=innerWidth*.66,my=innerHeight*.5,hx=mx,hy=my;
  const COL={'Game Designer':[120,230,255],'Technical Game Designer':[255,200,120],'Leadership':[220,150,255],'Game Programmer':[120,255,210]};
  const rc=p=>COL[p.role]||[150,220,255];
  const jel=DATA.map((p,i)=>({p,c:rc(p),ang:i/DATA.length*6.28,x:0,y:0,s:34+(p.cat==='PROFESSIONAL'?12:0),seed:Math.random()*99,ph:Math.random()*6.28}));
  const snow=[];
  function seed(){snow.length=0;const N=Math.min(150,Math.round(W*H/20000));for(let i=0;i<N;i++)snow.push({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.7,vy:-.04-Math.random()*.14,vx:-.06+Math.random()*.12,ph:Math.random()*6.28});}
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;seed();}
  addEventListener('resize',resize);resize();
  addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  const R=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
  // a translucent bioluminescent light: layered halos + saturated body + white-hot core (never a flat fill)
  function biolight(x,y,r,c,k){
    let gr=g.createRadialGradient(x,y,0,x,y,r*2.7);gr.addColorStop(0,R(c,.16*k));gr.addColorStop(1,R(c,0));g.fillStyle=gr;g.beginPath();g.arc(x,y,r*2.7,0,6.28);g.fill();
    gr=g.createRadialGradient(x,y,0,x,y,r*1.25);gr.addColorStop(0,R(c,.34*k));gr.addColorStop(.7,R(c,.14*k));gr.addColorStop(1,R(c,0));g.fillStyle=gr;g.beginPath();g.arc(x,y,r*1.25,0,6.28);g.fill();
    gr=g.createRadialGradient(x,y,0,x,y,r*.55);gr.addColorStop(0,`rgba(245,252,255,${.95*k})`);gr.addColorStop(.45,R(c,.7*k));gr.addColorStop(1,R(c,0));g.fillStyle=gr;g.beginPath();g.arc(x,y,r*.55,0,6.28);g.fill();
  }
  // a translucent jelly: glowing bell rim + see-through dome + drifting tentacles + a bioluminescent core
  function jelly(x,y,s,c,phase,k){
    // tentacles
    for(let i=0;i<7;i++){ const off=(i/6-.5)*s*1.3; g.beginPath(); g.moveTo(x+off*.6,y+s*.1);
      for(let q=1;q<=6;q++){ const ty=y+s*.1+q*s*.34; const wx=x+off+Math.sin(t*.045+q*.7+phase+i)*s*.16; g.lineTo(wx,ty); }
      const tg=g.createLinearGradient(x,y,x,y+s*2.1); tg.addColorStop(0,R(c,.35*k)); tg.addColorStop(1,R(c,0)); g.strokeStyle=tg; g.lineWidth=1.3; g.stroke(); }
    // translucent dome
    const dg=g.createRadialGradient(x,y-s*.1,0,x,y-s*.1,s*1.05); dg.addColorStop(0,`rgba(240,250,255,${.28*k})`); dg.addColorStop(.55,R(c,.22*k)); dg.addColorStop(1,R(c,0));
    g.fillStyle=dg; g.beginPath(); g.ellipse(x,y-s*.1,s,s*.82,0,Math.PI,2*Math.PI); g.fill();
    // glowing rim
    g.strokeStyle=R(c,.55*k); g.lineWidth=2; g.beginPath(); g.ellipse(x,y-s*.1,s,s*.82,0,Math.PI,2*Math.PI); g.stroke();
    g.strokeStyle=`rgba(245,252,255,${.5*k})`; g.lineWidth=1; g.stroke();
    // inner bioluminescent organs
    biolight(x,y-s*.2,s*.34,c,k*.9);
  }
  let hover=null;
  function frame(){
    if(W!==innerWidth||H!==innerHeight)resize();t++;hx+=(mx-hx)*.05;hy+=(my-hy)*.05;
    g.clearRect(0,0,W,H);g.globalCompositeOperation='lighter';
    for(const p of snow){p.x+=p.vx;p.y+=p.vy;if(p.y<-6){p.y=H+6;p.x=Math.random()*W;}if(p.x<-6)p.x=W+6;else if(p.x>W+6)p.x=-6;const tw=.4+.6*Math.sin(t*.03+p.ph);biolight(p.x,p.y,p.r*2.4,[150,220,255],.4*tw);}
    // YOU — a soft medusa drifting left-centre
    const cxp=W*.34+Math.sin(t*.006)*26,cyp=H*.5+Math.cos(t*.008)*20;
    jelly(cxp,cyp,52,[150,225,255],0,.55+.12*Math.sin(t*.02));
    hover=null;
    jel.forEach(o=>{
      o.ang+=0.0008+0.0003*Math.sin(o.seed);const orbitR=Math.min(W,H)*0.31;
      let tx=W*.62+Math.cos(o.ang+o.seed)*orbitR*(0.7+0.3*Math.sin(t*.004+o.seed)),ty=H*.5+Math.sin(o.ang+o.seed)*orbitR*0.62+Math.sin(t*.01+o.ph)*10;
      const dxc=hx-tx,dyc=hy-ty,dc=Math.hypot(dxc,dyc);if(dc<150){tx+=dxc*.16;ty+=dyc*.16;}
      o.x+=(tx-o.x)*.04;o.y+=(ty-o.y)*.04;
      const d=Math.hypot(hx-o.x,hy-o.y),near=d<o.s+40;if(near&&(!hover||d<hover.d))hover={o,d};
      const k=(near?.95:.5+.18*Math.sin(t*.03+o.ph));
      jelly(o.x,o.y,o.s,o.c,o.ph,k);
    });
    if(hover){g.globalCompositeOperation='source-over';g.textAlign='center';g.font="400 13px 'Syncopate'";g.fillStyle='rgba(238,250,255,.97)';g.fillText(hover.o.p.title.toUpperCase(),hover.o.x,hover.o.y-hover.o.s-30);g.font="300 11px 'Work Sans'";g.fillStyle='rgba(180,225,255,.7)';g.fillText(hover.o.p.cat+' · '+hover.o.p.year,hover.o.x,hover.o.y-hover.o.s-14);g.globalCompositeOperation='lighter';}
    biolight(hx,hy,16,[170,230,255],.4);
    g.globalCompositeOperation='source-over';document.hidden?setTimeout(frame,180):requestAnimationFrame(frame);
  }
  addEventListener('pointerdown',()=>{if(hover)openB(hover.o.p);});
  function openB(p){const c=rc(p),b=document.getElementById('bubble');b.innerHTML=`<div class="scrim"></div><div class="card" style="--rc:rgb(${c[0]},${c[1]},${c[2]})"><div class="meta">◎ ${p.cat} · ${p.year} · ${p.role}</div><h2>${p.title}</h2><p>${p.blurb}</p><div class="x">click anywhere to release</div></div>`;requestAnimationFrame(()=>b.classList.add('open'));document.getElementById('intro').classList.add('dim');}
  document.getElementById('bubble').addEventListener('click',()=>{document.getElementById('bubble').classList.remove('open');document.getElementById('intro').classList.remove('dim');});
  frame();
</script>
</body>
</html>
