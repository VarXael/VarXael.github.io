<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOCK · Flow · Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Work+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./mock-shared.css">
<style>
  /* ============================================================
     CONCEPT 2 — "FLOW · BLOOM"
     The deepest cut at flOw's philosophy: ZERO chrome.
     - No HUD, no gauge, no labels, no nav, no cursor creature.
       The page IS the sea. You don't operate an instrument; you
       ARE in the water.
     - The page does not scroll. Instead: you move the mouse / drag,
       and the entire SEA pans beneath you. Panning reveals what was
       off-screen. There is always more water beyond the edge.
     - Bioluminescent blooms fluoresce UP from the deep as your gaze
       (cursor) approaches them. Far away, they are dark, almost
       invisible. As you near, they brighten, surface, and become
       readable. This is flOw's DDA made literal: the player
       controls the difficulty by choosing what to approach.
     - Regions bloom into the four layers (Organism / Traits /
       Depths / Lineage) as you swim to different zones of the sea.
       There are no buttons. You discover the work by drifting
       toward it.
     - A specimen bloom, when touched, opens in-world (no new tab),
       the detail surface rising out of the same glow.
     This is throwaway concept code, not the real build.
     ============================================================ */
  html,body{height:100%;overflow:hidden;cursor:none}
  body{background:var(--abyss)}

  .ocean{position:fixed;inset:0;z-index:5;overflow:hidden;cursor:none}
  .world{position:absolute;left:0;top:0;width:200%;height:200%;transform-origin:0 0;
    transition:transform .8s var(--ease)}
  .world.free{transition:none}

  /* blooms: invisible until your gaze nears */
  .bloom{position:absolute;transform:translate(-50%,-50%);cursor:none;text-align:center;
    transition:opacity .6s var(--ease),filter .6s var(--ease),transform .6s var(--ease)}
  .bloom .halo{border-radius:50%;border:1px solid var(--lum-faint);
    background:radial-gradient(circle,color-mix(in srgb,var(--rc,#b4e6ff) 12%,rgba(3,9,13,.5)),rgba(3,9,13,.7));
    box-shadow:0 0 0 transparent;display:flex;align-items:center;justify-content:center;overflow:hidden;
    transition:box-shadow .6s var(--ease),border-color .6s var(--ease);margin:0 auto}
  .bloom .halo img{width:74%;height:74%;object-fit:cover;border-radius:50%;opacity:0;filter:grayscale(.5);transition:.6s}
  .bloom .cap{font-family:var(--head);font-size:.46rem;letter-spacing:2px;color:var(--rc,var(--lum));
    text-transform:uppercase;margin-top:14px;opacity:0;transition:.6s}
  .bloom .ttl{font-family:var(--body);font-weight:600;font-size:1.05rem;color:var(--ink);
    margin-top:5px;opacity:0;transition:.6s}

  /* proximity states: far / near / focused */
  .bloom.far .halo{opacity:.12;filter:blur(4px)}
  .bloom.near .halo{opacity:.55;filter:blur(0);border-color:color-mix(in srgb,var(--rc) 40%,transparent)}
  .bloom.near .halo img{opacity:.6}
  .bloom.near .cap{opacity:.7}
  .bloom.focused .halo{opacity:1;border-color:var(--rc);
    box-shadow:0 0 38px color-mix(in srgb,var(--rc) 45%,transparent),inset 0 0 30px color-mix(in srgb,var(--rc) 10%,transparent)}
  .bloom.focused .halo img{opacity:1;filter:none}
  .bloom.focused .cap{opacity:1}
  .bloom.focused .ttl{opacity:1}
  .bloom:hover .halo{transform:scale(1.06)}

  /* the seed: the central name bloom (Organism) */
  .bloom.seed .halo{width:240px;height:240px;border-color:var(--lum);
    background:radial-gradient(circle,rgba(180,230,255,.10),rgba(3,9,13,.85))}
  .bloom.seed .seedname{font-family:var(--head);font-weight:700;text-transform:uppercase;
    letter-spacing:-1px;color:var(--lum-bright);text-shadow:0 0 30px rgba(180,230,255,.45);
    font-size:1.8rem;line-height:1.1;text-align:center}
  .bloom.seed .seedrole{font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:var(--lum);
    margin-top:10px;opacity:.8}
  .bloom.seed .seedi{font-family:var(--body);font-style:italic;color:var(--lum-soft);
    font-size:.85rem;margin-top:14px;max-width:22ch;line-height:1.4}

  /* project bloom sizes */
  .bloom.spec .halo{width:130px;height:130px}
  .bloom.trait .halo{width:96px;height:96px;border-color:var(--rc);
    background:radial-gradient(circle,color-mix(in srgb,var(--rc) 20%,rgba(3,9,13,.6)),rgba(3,9,13,.85))}
  .bloom.trait .halo::after{content:"";position:absolute;inset:-7px;border:1px dashed color-mix(in srgb,var(--rc) 30%,transparent);border-radius:50%;animation:spin 22s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* region labels — whispered, not chrome. appear only when you are in the region */
  .region-whisper{position:absolute;transform:translate(-50%,0);font-family:var(--head);
    font-size:.7rem;letter-spacing:6px;color:var(--lum);text-transform:uppercase;opacity:0;
    text-shadow:0 0 20px rgba(180,230,255,.4);transition:opacity 1.2s var(--ease);pointer-events:none;
    text-align:center}
  .region-whisper.show{opacity:.5}
  .region-whisper .sub{display:block;font-size:.42rem;letter-spacing:3px;color:var(--dim);margin-top:6px}

  /* the cursor: a soft luminous point (your "gaze"). no creature, just light. */
  canvas#gaze{position:fixed;inset:0;z-index:60;pointer-events:none;width:100%;height:100%}

  /* lineage bloom: a long horizontal membrane rather than a circle */
  .bloom.lineage{width:min(640px,80vw)}
  .bloom.lineage .halo{width:100%;height:auto;border-radius:18px;aspect-ratio:auto;padding:28px 32px;
    background:linear-gradient(160deg,rgba(8,26,34,.7),rgba(3,9,13,.85));flex-direction:column;gap:18px}
  .bloom.lineage .halo::after{display:none}
  .bloom.lineage .lin-item{text-align:left;padding-left:16px;border-left:1px solid var(--lum-faint)}
  .bloom.lineage .lin-when{font-family:var(--head);font-size:.46rem;letter-spacing:2px;color:var(--dim)}
  .bloom.lineage .lin-what{font-weight:600;font-size:.92rem;text-transform:uppercase;letter-spacing:.5px;margin:4px 0;color:var(--ink);opacity:0;transition:.6s}
  .bloom.lineage .lin-where{font-size:.84rem;line-height:1.5;color:var(--dim);opacity:0;transition:.6s}
  .bloom.lineage.near .lin-what,.bloom.lineage.near .lin-where,.bloom.lineage.focused .lin-what,.bloom.lineage.focused .lin-where{opacity:1}

  /* the only persistent thing: a depth number, whispered, no label */
  .depth-whisper{position:fixed;bottom:20px;right:24px;z-index:30;font-family:var(--head);
    font-size:.6rem;letter-spacing:3px;color:var(--lum-soft);opacity:.4;transition:.6s;pointer-events:none}
  .depth-whisper b{color:var(--lum)}

  /* diegetic specimen detail — rises from the bloom's own glow */
  .detail{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;opacity:0;
    pointer-events:none;transition:opacity .6s var(--ease)}
  .detail.open{opacity:1;pointer-events:auto}
  .detail .scrim{position:absolute;inset:0;background:rgba(2,6,9,.7);backdrop-filter:blur(7px)}
  .detail .panel{--rc:var(--lum);position:relative;width:min(660px,90vw);max-height:86vh;overflow-y:auto;
    background:linear-gradient(160deg,rgba(8,26,34,.92),rgba(3,9,13,.96));
    border:1px solid color-mix(in srgb,var(--rc) 40%,var(--lum-faint));border-radius:20px;
    box-shadow:0 0 100px color-mix(in srgb,var(--rc) 16%,transparent);transform:scale(.88) translateY(24px);transition:transform .7s var(--ease)}
  .detail.open .panel{transform:scale(1) translateY(0)}
  .detail .pmedia{height:210px;background:#000;overflow:hidden;border-radius:20px 20px 0 0}
  .detail .pmedia img{width:100%;height:100%;object-fit:cover;filter:grayscale(.15)}
  .detail .pinner{padding:26px 30px 32px}
  .detail .pmeta{font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:var(--rc);text-transform:uppercase;margin-bottom:12px;opacity:.9}
  .detail .ptitle{font-family:var(--head);font-size:1.6rem;text-transform:uppercase;letter-spacing:-.5px;color:var(--lum-bright);margin-bottom:16px;text-shadow:0 0 26px rgba(180,230,255,.3)}
  .detail .pblurb{font-size:1.05rem;line-height:1.7;margin-bottom:16px}
  .detail .pstory{font-size:.95rem;line-height:1.8;color:var(--dim);border-left:1px solid color-mix(in srgb,var(--rc) 35%,transparent);padding-left:16px;margin-bottom:20px}
  .detail .pclose{position:absolute;top:14px;right:16px;background:rgba(3,9,13,.6);border:1px solid var(--lum-faint);color:var(--dim);font-family:var(--head);font-size:.46rem;letter-spacing:2px;padding:8px 13px;border-radius:16px;transition:.3s}
  .detail .pclose:hover{color:var(--lum);border-color:var(--lum)}
  .detail .btn,.detail .pclose{cursor:none}

  @media(prefers-reduced-motion:reduce){ .bloom,.world{transition:opacity .2s linear} .bloom.trait .halo::after{animation:none} }
  @media(pointer:coarse){ html,body{cursor:auto} .bloom,.btn,.pclose{cursor:pointer} }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div class="depth-fog" id="fog" style="opacity:.18"></div>
<div class="vignette"></div>

<div class="mock-tag">★ Flow · Bloom</div>
<a class="mock-back" href="./mock.html">↑ All mockups</a>

<div class="ocean" id="ocean">
  <div class="world" id="world">
    <!-- regions are zones of the world; whispers fade in when you enter -->
    <div class="region-whisper" id="rw-0" style="left:25%;top:6%">Organism<span class="sub">the surface</span></div>
    <div class="region-whisper" id="rw-1" style="left:72%;top:18%">Traits<span class="sub">the disciplines</span></div>
    <div class="region-whisper" id="rw-2" style="left:30%;top:62%">Depths<span class="sub">the work</span></div>
    <div class="region-whisper" id="rw-3" style="left:75%;top:88%">Lineage<span class="sub">origins</span></div>

    <!-- SEED: the central Organism bloom -->
    <div class="bloom seed" style="left:25%;top:30%">
      <div class="halo">
        <div>
          <div class="seedname">Giuseppe<br>Alfieri</div>
          <div class="seedrole">Game &amp; Technical Designer</div>
          <div class="seedi">"I design games where the systems tell the story."</div>
        </div>
      </div>
    </div>

    <!-- TRAITS blooms (top right cluster) -->
    <!-- DEPTHS blooms (bottom left cluster) — injected by JS -->
    <!-- LINEAGE bloom (bottom right) — injected by JS -->
  </div>
</div>

<canvas id="gaze"></canvas>
<div class="depth-whisper" id="depthWhisper">DEPTH <b id="dNum">0M</b></div>

<script src="./mock-data.js"></script>
<script>
  mockSea();

  const world = document.getElementById('world');
  const ocean = document.getElementById('ocean');
  const fog = document.getElementById('fog');
  const dNum = document.getElementById('dNum');
  const blooms = [...document.querySelectorAll('.bloom')];
  const regionWhispers = [...document.querySelectorAll('.region-whisper')];

  /* ---------- place trait blooms ---------- */
  const counts = traitCounts();
  const roles = Object.keys(RC);
  // cluster traits around the top-right region center (72%, 30%)
  roles.forEach((r,i)=>{
    const ang = -Math.PI/2 + i/roles.length*Math.PI*2;
    const cx = 72, cy = 30, rad = 9;
    const x = cx + Math.cos(ang)*rad;
    const y = cy + Math.sin(ang)*rad;
    const el = document.createElement('div');
    el.className = 'bloom trait';
    el.dataset.role = r;
    el.style.left = x+'%'; el.style.top = y+'%';
    el.style.setProperty('--rc', RC[r]);
    el.innerHTML = `<div class="halo"></div><div class="cap">${r}</div><div class="ttl">${String(counts[r]||0).padStart(2,'0')} specimens</div>`;
    world.appendChild(el);
  });

  /* ---------- place project (spec) blooms ---------- */
  // cluster around bottom-left region center (30%, 78%)
  DATA.forEach((p,i)=>{
    const ang = i/DATA.length*Math.PI*2;
    const cx = 30, cy = 78;
    const rad = 13 + (i%2)*4;
    const x = cx + Math.cos(ang)*rad;
    const y = cy + Math.sin(ang)*rad*0.6;
    const rc = roleColor(p.role);
    const el = document.createElement('div');
    el.className = 'bloom spec';
    el.dataset.id = p.id;
    el.dataset.role = p.role;
    el.style.left = x+'%'; el.style.top = y+'%';
    el.style.setProperty('--rc', rc);
    el.innerHTML = `<div class="halo"><img src="${p.img}" alt="${p.title}"></div><div class="cap">${p.cat} · ${p.year}</div><div class="ttl">${p.title}</div>`;
    world.appendChild(el);
    el.addEventListener('click',()=>openDetail(p.id));
  });

  /* ---------- place lineage bloom ---------- */
  (function(){
    const el = document.createElement('div');
    el.className = 'bloom lineage';
    el.style.left = '75%'; el.style.top = '82%';
    el.style.setProperty('--rc','#7dffd0');
    el.innerHTML = `<div class="halo">${LINEAGE.map(l=>`
      <div class="lin-item">
        <div class="lin-when">${l.when}</div>
        <div class="lin-what">${l.what}</div>
        <div class="lin-where">${l.where}</div>
      </div>`).join('')}</div>`;
    world.appendChild(el);
  })();

  // re-collect all blooms after injection
  const allBlooms = [...document.querySelectorAll('.bloom')];

  /* ---------- panning: move the sea under your gaze ---------- */
  let tx=0, ty=0;          // world translate (px)
  let gx=innerWidth/2, gy=innerHeight/2;  // gaze (screen px)
  let dragging=false, sx=0, sy=0, moved=false;

  function gazeToWorld(sx, sy){
    // world is 200% x 200%; the .world origin is at (0,0) of ocean, translated by (tx,ty)
    const rect = world.getBoundingClientRect();
    return { x: sx - rect.left, y: sy - rect.top };
  }

  function proximity(bloom){
    // distance from gaze (in world coords) to bloom center (in world coords)
    const w = gazeToWorld(gx, gy);
    const r = bloom.getBoundingClientRect();
    const bw = world.getBoundingClientRect();
    const bx = r.left + r.width/2 - bw.left;
    const by = r.top + r.height/2 - bw.top;
    const dx = w.x - bx, dy = w.y - by;
    return Math.sqrt(dx*dx + dy*dy);
  }

  const NEAR = 260, FOCUS = 130;
  function updateProximity(){
    allBlooms.forEach(b=>{
      const d = proximity(b);
      b.classList.remove('far','near','focused');
      if(d < FOCUS) b.classList.add('focused');
      else if(d < NEAR) b.classList.add('near');
      else b.classList.add('far');
    });
    // region whispers
    regionWhispers.forEach((rw,i)=>{
      const r = rw.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      const dd = Math.hypot(gx-cx, gy-cy);
      rw.classList.toggle('show', dd < innerWidth*0.32);
    });
    // depth number: deeper as you pan down/right
    const depth = Math.round((Math.abs(tx) + Math.abs(ty)) / 14);
    dNum.textContent = depth + 'M';
    fog.style.opacity = 0.10 + Math.min(0.5, depth/4000);
  }

  /* drag to pan */
  ocean.addEventListener('pointerdown', e=>{
    if(e.target.closest('.bloom, .btn, .pclose')) return;
    dragging=true; moved=false; sx=e.clientX; sy=e.clientY; world.classList.add('free');
  });
  addEventListener('pointermove', e=>{
    gx=e.clientX; gy=e.clientY;
    if(dragging){
      const dx=e.clientX-sx, dy=e.clientY-sy;
      if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
      tx+=dx; ty+=dy; sx=e.clientX; sy=e.clientY;
      world.style.transform = `translate(${tx}px,${ty}px)`;
    }
    updateProximity();
  });
  addEventListener('pointerup', ()=>{ dragging=false; world.classList.remove('free'); });

  // keyboard pan (accessibility)
  addEventListener('keydown',e=>{
    const step=120; let panned=false;
    if(e.key==='ArrowRight'){tx-=step;panned=true} else if(e.key==='ArrowLeft'){tx+=step;panned=true}
    else if(e.key==='ArrowDown'){ty-=step;panned=true} else if(e.key==='ArrowUp'){ty+=step;panned=true}
    if(panned){ world.classList.add('free'); world.style.transform=`translate(${tx}px,${ty}px)`; world.classList.remove('free'); updateProximity(); }
  });

  /* ---------- the gaze: a soft luminous point ---------- */
  const cv = document.getElementById('gaze');
  const g = cv.getContext('2d');
  let W,H;
  function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
  addEventListener('resize',resize); resize();
  let t=0;
  function drawGaze(){
    g.clearRect(0,0,W,H);
    t++;
    const pulse = 0.6 + 0.4*Math.sin(t*0.04);
    const grd = g.createRadialGradient(gx,gy,0,gx,gy,90);
    grd.addColorStop(0, `rgba(180,230,255,${0.10*pulse})`);
    grd.addColorStop(0.5, `rgba(180,230,255,${0.03*pulse})`);
    grd.addColorStop(1, 'rgba(180,230,255,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(gx,gy,90,0,6.2832); g.fill();
    g.globalCompositeOperation='lighter';
    g.fillStyle = `rgba(223,244,255,${0.7*pulse})`;
    g.beginPath(); g.arc(gx,gy,2.5,0,6.2832); g.fill();
    g.globalCompositeOperation='source-over';
    document.hidden ? setTimeout(drawGaze,220) : requestAnimationFrame(drawGaze);
  }
  drawGaze();

  /* ---------- trait bloom click: dim-don't-hide lens ---------- */
  let activeTrait = null;
  allBlooms.filter(b=>b.classList.contains('trait')).forEach(b=>{
    b.addEventListener('click',()=>{
      activeTrait = activeTrait===b.dataset.role ? null : b.dataset.role;
      allBlooms.filter(x=>x.classList.contains('trait')).forEach(t=>t.style.outline='none');
      allBlooms.filter(x=>x.classList.contains('spec')).forEach(s=>{
        s.style.opacity = (activeTrait && s.dataset.role!==activeTrait) ? '.14' : '';
        s.style.filter = (activeTrait && s.dataset.role!==activeTrait) ? 'blur(3px) saturate(.3)' : '';
      });
    });
  });

  // initial: everything is far until you move
  updateProximity();
</script>
</body>
</html>
