<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio · Haeckel Glass (radiolaria × flOw)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Work+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#e9f4fb;--dim:rgba(233,244,251,.56);--lum:#b4e6ff;--gold:#e8c074;--gold-line:rgba(232,192,116,.26);--head:'Syncopate',sans-serif;--body:'Work Sans',sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--body);color:var(--ink);background:radial-gradient(120% 90% at 78% 50%,#06141d 0%,#03090f 55%,#01060a 100%)}
  #bg{position:fixed;inset:0;z-index:0;opacity:.55}
  .tag,.back{position:fixed;top:16px;z-index:40;font-family:var(--head);font-size:.5rem;letter-spacing:3px;color:var(--gold);text-transform:uppercase;background:rgba(6,18,26,.45);border:1px solid var(--gold-line);padding:7px 12px;border-radius:4px}
  .tag{left:16px}.back{right:16px;color:var(--dim)}
  .frame{position:fixed;inset:14px;z-index:30;pointer-events:none;border:1px solid var(--gold-line);border-radius:3px}
  .sheet{position:fixed;inset:0;z-index:5;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:40px;padding:8vh 8vw}
  .left{max-width:560px}
  .brand{font-family:var(--head);font-size:.5rem;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:24px;display:flex;align-items:center;gap:10px}
  .brand::before{content:"";width:18px;height:1px;background:var(--gold)}
  .title{font-family:var(--head);font-weight:700;font-size:clamp(2rem,4.4vw,3.2rem);line-height:1.04;letter-spacing:-1px;color:#eef8ff;text-shadow:0 0 46px rgba(140,210,255,.32)}
  .sub{font-family:var(--head);font-size:.6rem;letter-spacing:5px;color:var(--rc,var(--lum));text-transform:uppercase;margin:14px 0 32px;text-shadow:0 0 18px color-mix(in srgb,var(--rc,var(--lum)) 45%,transparent)}
  .facet{margin-bottom:24px;position:relative;padding-left:22px}
  .facet::before{content:"";position:absolute;left:0;top:5px;width:9px;height:9px;border:1px solid var(--gold);border-radius:50%;box-shadow:0 0 10px var(--gold-line)}
  .facet::after{content:"";position:absolute;left:3px;top:8px;width:3px;height:3px;border-radius:50%;background:var(--rc,var(--lum));box-shadow:0 0 8px var(--rc,var(--lum))}
  .facet h3{font-family:var(--head);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:#dff2ff;margin-bottom:9px}
  .facet p{font-size:.92rem;line-height:1.7;color:var(--dim);max-width:440px}
  .right{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
  #scope{width:min(66vh,580px);height:min(66vh,580px)}
  .switch{position:fixed;left:8vw;bottom:6vh;z-index:10;display:flex;align-items:center;gap:18px}
  .switch button{width:38px;height:38px;border-radius:3px;border:1px solid var(--gold-line);background:rgba(6,18,26,.55);color:var(--gold);font-size:1rem;cursor:pointer;transition:.3s}
  .switch button:hover{border-color:var(--gold);box-shadow:0 0 16px var(--gold-line)}
  .switch .idx{font-family:var(--head);font-size:.56rem;letter-spacing:3px;color:var(--dim)}.switch .idx b{color:var(--gold)}
  .observe{position:fixed;right:8vw;bottom:6vh;z-index:10;font-family:var(--head);font-size:.52rem;letter-spacing:2px;color:var(--gold);text-transform:uppercase;border:1px solid var(--gold-line);padding:11px 18px;border-radius:3px;background:rgba(6,18,26,.5);cursor:pointer;transition:.3s}
  .observe:hover{border-color:var(--gold);box-shadow:0 0 16px var(--gold-line)}
  @media(max-width:880px){.sheet{grid-template-columns:1fr;overflow-y:auto}.right{height:44vh}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="frame"></div>
<div class="tag">⬡ Bio · Haeckel Glass</div><a class="back" href="./styles.html">↑ Style chooser</a>
<div class="sheet">
  <div class="left">
    <div class="brand">Specimen Observation Log</div>
    <h1 class="title" id="title">—</h1>
    <div class="sub" id="sub">—</div>
    <div class="facet"><h3>The System</h3><p id="f1">—</p></div>
    <div class="facet"><h3>The Role</h3><p id="f2">—</p></div>
    <div class="facet"><h3>The Story</h3><p id="f3">—</p></div>
  </div>
  <div class="right"><canvas id="scope"></canvas></div>
</div>
<div class="switch"><button id="prev">‹</button><div class="idx">SPECIMEN <b id="ix">01</b> / 06</div><button id="next">›</button></div>
<button class="observe" id="observe">◎ Observe in full</button>
<script src="./mock-data.js"></script>
<script>
  const COL={'Game Designer':'#7fe3ff','Technical Game Designer':'#ffd27a','Leadership':'#e6a8ff','Game Programmer':'#7dffd0'};
  const hexrgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  let i=0,base=[127,227,255];
  (function bg(){const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,t=0,pk=[];function rs(){W=c.width=innerWidth;H=c.height=innerHeight;pk=[];for(let k=0;k<90;k++)pk.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.6,vy:-.04-Math.random()*.1,ph:Math.random()*6.28});}addEventListener('resize',rs);rs();(function f(){t++;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';for(const p of pk){p.y+=p.vy;if(p.y<-6){p.y=H+6;p.x=Math.random()*W;}const tw=.4+.6*Math.sin(t*.03+p.ph);const gr=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);gr.addColorStop(0,`rgba(180,230,255,${.35*tw})`);gr.addColorStop(1,'rgba(180,230,255,0)');x.fillStyle=gr;x.beginPath();x.arc(p.x,p.y,p.r*5,0,6.28);x.fill();}x.globalCompositeOperation='source-over';document.hidden?setTimeout(f,200):requestAnimationFrame(f);})();})();
  // translucent GLASS radiolaria: SSS membrane + Fresnel rim + structural-iridescent edges
  const sc=document.getElementById('scope'),g=sc.getContext('2d');let SW,t=0;
  function rs2(){const s=Math.min(innerHeight*.66,580);sc.width=sc.height=s*devicePixelRatio;sc.style.width=sc.style.height=s+'px';g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);SW=s;}
  addEventListener('resize',rs2);rs2();
  // shift a base colour toward violet/green for iridescence
  function irid(b,sh){const v=[[180,150,255],[120,255,210]];const m=sh<0?v[0]:v[1],a=Math.abs(sh);return [b[0]+(m[0]-b[0])*a,b[1]+(m[1]-b[1])*a,b[2]+(m[2]-b[2])*a];}
  function draw(){t++;const cx=SW/2,cy=SW/2,R=SW*.37,pulse=.5+.5*Math.sin(t*.02);
    const L=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
    g.clearRect(0,0,SW,SW);g.globalCompositeOperation='lighter';
    // SSS membrane (light enters, glows from within, transparent centre)
    let mg=g.createRadialGradient(cx-R*.2,cy-R*.2,0,cx,cy,R*1.12);mg.addColorStop(0,L(base,.02));mg.addColorStop(.55,L(base,.11));mg.addColorStop(.82,L(base,.05));mg.addColorStop(1,L(base,0));g.fillStyle=mg;g.beginPath();g.arc(cx,cy,R*1.12,0,6.28);g.fill();
    // shells with Fresnel-bright rims
    [1,.78,.56,.34].forEach((rk,k)=>{const rr=R*rk;const sg=g.createRadialGradient(cx,cy,rr*.86,cx,cy,rr*1.14);sg.addColorStop(0,L(base,0));sg.addColorStop(.5,L(base,(k===1?.55:.32)*(.7+.3*pulse)));sg.addColorStop(1,L(base,0));g.strokeStyle=sg;g.lineWidth=k===1?5:3;if(k===1)g.setLineDash([4,11]);else g.setLineDash([]);g.beginPath();g.arc(cx,cy,rr,0,6.28);g.stroke();});g.setLineDash([]);
    // spokes + iridescent nodes on the rim (structural colour shifts around the circle)
    const N=20;for(let k=0;k<N;k++){const a=t*.0022+k/N*6.28,sh=Math.sin(a*2+t*.01),col=irid(base,sh);
      const x1=cx+Math.cos(a)*R*.3,y1=cy+Math.sin(a)*R*.3,x2=cx+Math.cos(a)*R*1.12,y2=cy+Math.sin(a)*R*1.12;
      const lg=g.createLinearGradient(x1,y1,x2,y2);lg.addColorStop(0,L(base,0));lg.addColorStop(.5,L(col,.2));lg.addColorStop(1,L(base,0));g.strokeStyle=lg;g.lineWidth=1.3;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
      const nx=cx+Math.cos(a)*R,ny=cy+Math.sin(a)*R,np=.5+.5*Math.sin(t*.05+k);let ng=g.createRadialGradient(nx,ny,0,nx,ny,7);ng.addColorStop(0,`rgba(248,253,255,${.9*np})`);ng.addColorStop(.4,L(col,.65*np));ng.addColorStop(1,L(col,0));g.fillStyle=ng;g.beginPath();g.arc(nx,ny,7,0,6.28);g.fill();}
    // white-hot bioluminescent core
    let cg=g.createRadialGradient(cx,cy,0,cx,cy,R*.24);cg.addColorStop(0,'rgba(255,255,255,.95)');cg.addColorStop(.35,L(base,.7));cg.addColorStop(1,L(base,0));g.fillStyle=cg;g.beginPath();g.arc(cx,cy,R*.24,0,6.28);g.fill();
    g.globalCompositeOperation='source-over';document.hidden?setTimeout(draw,120):requestAnimationFrame(draw);}
  draw();
  function render(){const p=DATA[i],c=COL[p.role]||'#b4e6ff';base=hexrgb(c);document.documentElement.style.setProperty('--rc',c);
    document.getElementById('title').textContent=p.title;const sb=document.getElementById('sub');sb.textContent=`${p.cat} · ${p.year} · ${p.role}`;sb.style.color=c;
    document.getElementById('f1').textContent=p.blurb;document.getElementById('f2').textContent=`${p.role}. A self-contained system taken from concept to a working build.`;document.getElementById('f3').textContent=p.story;
    document.getElementById('ix').textContent=String(i+1).padStart(2,'0');document.querySelectorAll('.facet').forEach(f=>f.style.setProperty('--rc',c));}
  document.getElementById('prev').onclick=()=>{i=(i+DATA.length-1)%DATA.length;render();};
  document.getElementById('next').onclick=()=>{i=(i+1)%DATA.length;render();};
  document.getElementById('observe').onclick=()=>openDetail(DATA[i].id);
  addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();else if(e.key==='ArrowLeft')document.getElementById('prev').click();});
  render();
</script>
</body>
</html>
