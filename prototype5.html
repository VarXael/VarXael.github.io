<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giuseppe Alfieri — Prototype 5: Monolith</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
/* PROTOTYPE 5: THE MONOLITH (High Editorial / Brutalist Alien)
   Strips away all "tech/terminal" baggage. No brackets, no dashed lines, no HUD.
   Focuses on pure typographic scale, extreme negative space, and cinematic weight.
   Colors: Void (black), Bone (white), Sacred Gold (accent).
*/
:root {
  --void: #050506;
  --bone: #e3ded5;
  --dim: rgba(227, 222, 213, 0.4);
  --gold: #d4af37;
  --gold-dim: rgba(212, 175, 55, 0.3);
  --display: 'Cinzel', serif;
  --text: 'Inter', sans-serif;
  --italic: 'Cormorant Garamond', serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { 
  background-color: var(--void); 
  color: var(--bone); 
  font-family: var(--text); 
  overflow-x: hidden;
  line-height: 1.6;
}

/* Background Texture */
.noise {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
}

/* Navigation */
nav {
  position: fixed; top: 0; left: 0; width: 100%; z-index: 50;
  display: flex; justify-content: space-between; align-items: center;
  padding: 40px 60px;
  mix-blend-mode: difference;
}
.logo { font-family: var(--display); font-size: 1.2rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bone); text-decoration: none; }
.nav-links { display: flex; gap: 40px; }
.nav-links a { font-family: var(--text); font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--bone); text-decoration: none; opacity: 0.6; transition: opacity 0.4s; }
.nav-links a:hover { opacity: 1; }

/* Hero Section */
.hero {
  position: relative; z-index: 10; height: 100vh;
  display: flex; flex-direction: column; justify-content: center;
  padding: 0 60px;
}
.hero-role {
  font-family: var(--italic); font-size: 2rem; color: var(--gold);
  margin-bottom: 20px; opacity: 0; animation: fadeUp 1s 0.2s forwards;
}
.hero-title {
  font-family: var(--display); font-size: clamp(4rem, 12vw, 10rem);
  font-weight: 400; line-height: 0.85; text-transform: uppercase;
  margin-bottom: 40px; letter-spacing: -0.02em;
  opacity: 0; animation: fadeUp 1s 0.4s forwards;
}
.hero-desc {
  max-width: 500px; font-size: 1.1rem; color: var(--dim);
  opacity: 0; animation: fadeUp 1s 0.6s forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Works Section */
.works {
  position: relative; z-index: 10; padding: 120px 60px;
}
.section-title {
  font-family: var(--display); font-size: 3rem; text-transform: uppercase;
  font-weight: 400; margin-bottom: 80px; text-align: center; color: var(--bone);
  border-bottom: 1px solid var(--gold-dim); padding-bottom: 20px;
}

.gallery {
  display: flex; flex-direction: column; gap: 160px;
}
.work-item {
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 80px; align-items: center;
  opacity: 0; transform: translateY(40px); transition: opacity 0.8s, transform 0.8s;
}
.work-item.visible { opacity: 1; transform: translateY(0); }
.work-item:nth-child(even) { grid-template-columns: 1fr 1.2fr; text-align: right; }
.work-item:nth-child(even) .work-image { order: 2; }
.work-item:nth-child(even) .work-info { order: 1; }

.work-image {
  width: 100%; aspect-ratio: 16/9; overflow: hidden;
  position: relative; cursor: pointer;
}
.work-image img {
  width: 100%; height: 100%; object-fit: cover;
  filter: grayscale(1) contrast(1.1); transition: filter 0.8s, transform 1.2s;
}
.work-image:hover img {
  filter: grayscale(0) contrast(1); transform: scale(1.03);
}

.work-category {
  font-family: var(--italic); font-size: 1.4rem; color: var(--gold); margin-bottom: 10px;
}
.work-title {
  font-family: var(--display); font-size: 3.5rem; line-height: 1; margin-bottom: 24px; text-transform: uppercase;
}
.work-short {
  font-size: 1.1rem; color: var(--dim); margin-bottom: 30px;
}
.work-btn {
  display: inline-block; padding: 14px 32px; border: 1px solid var(--gold);
  color: var(--gold); font-family: var(--text); font-size: 0.8rem; letter-spacing: 0.1em;
  text-transform: uppercase; text-decoration: none; transition: 0.4s; cursor: pointer;
  background: transparent;
}
.work-btn:hover {
  background: var(--gold); color: var(--void);
}

/* Project Modal / Morph */
.modal {
  position: fixed; inset: 0; background: var(--void); z-index: 100;
  display: flex; flex-direction: column; overflow-y: auto;
  opacity: 0; pointer-events: none; transition: opacity 0.5s;
}
.modal.open { opacity: 1; pointer-events: auto; }
.modal-close {
  position: fixed; top: 40px; right: 60px; background: none; border: none;
  color: var(--bone); font-family: var(--text); font-size: 0.8rem; letter-spacing: 0.2em;
  text-transform: uppercase; cursor: pointer; z-index: 110;
}
.modal-hero {
  width: 100%; height: 60vh; position: relative;
}
.modal-hero img {
  width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.5);
}
.modal-hero-overlay {
  position: absolute; inset: 0; background: linear-gradient(to top, var(--void), transparent);
}
.modal-content {
  padding: 60px; max-width: 1000px; margin: -100px auto 100px; position: relative; z-index: 10;
}
.modal-title { font-family: var(--display); font-size: 4rem; text-transform: uppercase; line-height: 1; margin-bottom: 20px; }
.modal-meta { font-family: var(--italic); font-size: 1.5rem; color: var(--gold); margin-bottom: 40px; border-bottom: 1px solid var(--dim); padding-bottom: 20px; }
.modal-text { font-size: 1.2rem; line-height: 1.8; color: var(--bone); margin-bottom: 40px; }

@media (max-width: 900px) {
  .hero-title { font-size: clamp(3rem, 15vw, 6rem); }
  .work-item, .work-item:nth-child(even) { grid-template-columns: 1fr; text-align: left; gap: 40px; }
  .work-item:nth-child(even) .work-image { order: 1; }
  .work-item:nth-child(even) .work-info { order: 2; }
}
</style>
</head>
<body>
<div class="noise"></div>

<nav>
  <a href="#" class="logo">G. Alfieri</a>
  <div class="nav-links">
    <a href="#works">Archive</a>
    <a href="#">Contact</a>
  </div>
</nav>

<section class="hero">
  <div class="hero-role">Systems Architect</div>
  <h1 class="hero-title">Giuseppe<br>Alfieri</h1>
  <p class="hero-desc">I design games where the systems tell the story, architecting interconnected mechanics where every piece has a reason to exist.</p>
</section>

<section class="works" id="works">
  <h2 class="section-title">The Archive</h2>
  <div class="gallery" id="gallery"></div>
</section>

<div class="modal" id="modal">
  <button class="modal-close" onclick="closeModal()">Close ✕</button>
  <div class="modal-hero">
    <img id="modal-img" src="" alt="">
    <div class="modal-hero-overlay"></div>
  </div>
  <div class="modal-content">
    <h2 class="modal-title" id="modal-title">Title</h2>
    <div class="modal-meta" id="modal-meta">Role / Engine / Year</div>
    <div class="modal-text" id="modal-text">Description</div>
  </div>
</div>

<script>
const projects = [
  {
    title: 'High on Life',
    cat: 'Professional Work',
    meta: 'Programmer / Unreal Engine / 2025',
    img: './assets/images/HighOnLife.png',
    short: 'Nintendo Switch port. Primary reference for the game\'s systems, debugging, and tooling.',
    long: 'Nintendo Switch port. Over 8 months I became the team\'s primary reference for the game\'s systems — deep C++/Blueprint debugging, internal tooling from scratch, critical subsystems rewritten for Switch stability.'
  },
  {
    title: 'Sasha',
    cat: 'Personal Project',
    meta: 'Sole Creator / Unreal Engine / 2025',
    img: './assets/images/ProjectSasha.svg',
    short: 'A top-down game where scanning IS the entire game. Knowledge is the resource.',
    long: 'A top-down game where scanning IS the entire game. You pilot an android through a brutalist megastructure that doesn\'t exist until you scan it into being. Knowledge is the resource; every mechanical decision is a memory decision.'
  },
  {
    title: 'Cadence',
    cat: 'Systems Architecture',
    meta: 'Tech Designer / Unreal & Metasound / 2025',
    img: './assets/images/ProjectCadence.png',
    short: 'A C++ Unreal plugin where music drives gameplay — a reusable rhythm framework.',
    long: 'A C++ Unreal plugin where music drives gameplay. Parse a beatmap, map timestamps to actions, fire them in-game at exactly those moments — timing data fully separated from behaviour, so one beatmap can power any genre.'
  }
];

const gallery = document.getElementById('gallery');
projects.forEach((p, idx) => {
  const item = document.createElement('div');
  item.className = 'work-item';
  item.innerHTML = `
    <div class="work-image" onclick="openModal(${idx})">
      <img src="${p.img}" alt="${p.title}">
    </div>
    <div class="work-info">
      <div class="work-category">${p.cat}</div>
      <h3 class="work-title">${p.title}</h3>
      <p class="work-short">${p.short}</p>
      <button class="work-btn" onclick="openModal(${idx})">View Exhibition</button>
    </div>
  `;
  gallery.appendChild(item);
});

// Intersection Observer for scroll animations
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.1 });

document.querySelectorAll('.work-item').forEach(item => observer.observe(item));

// Modal Logic
const modal = document.getElementById('modal');
function openModal(idx) {
  const p = projects[idx];
  document.getElementById('modal-img').src = p.img;
  document.getElementById('modal-title').textContent = p.title;
  document.getElementById('modal-meta').textContent = p.meta;
  document.getElementById('modal-text').textContent = p.long;
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  modal.classList.remove('open');
  document.body.style.overflow = '';
}
</script>
</body>
</html>
